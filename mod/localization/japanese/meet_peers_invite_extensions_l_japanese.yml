 mpie_peer_goal_missed_log_title:0 "逃した機会"
 mpie_peer_goal_missed_log:0 "[CHARACTER.GetTitledFirstName]は[TARGET_CHARACTER.GetTitledFirstName]と過ごす機会に恵まれなかった"
 mpie_peer_goal_no_moment_log_title:0 "すれ違い"
 mpie_peer_goal_no_moment_log:0 "[CHARACTER.GetTitledFirstName]は[TARGET_CHARACTER.GetTitledFirstName]と過ごす、ちょうどよい機会をつかめなかった"
 mpie_peer_befriend_failed_log_title:0 "まだ友達ではない"
 mpie_peer_befriend_failed_log:0 "[CHARACTER.GetTitledFirstName]は[TARGET_CHARACTER.GetTitledFirstName]と友達になろうとしたが、うまくいかなかった"
 mpie_peer_learned_log_title:0 "実りある教え"
 mpie_peer_learned_log:0 "[CHARACTER.GetTitledFirstName]は[TARGET_CHARACTER.GetTitledFirstName]からいくつかのことを学んだ"
