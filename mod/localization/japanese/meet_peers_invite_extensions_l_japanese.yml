l_japanese:
 # Meet Peers guest invite rules
 mpie_invite_rule_neighbors_children:0 "近隣の子供"
 mpie_invite_rule_same_faith_children:0 "同じ信仰の子供"
 mpie_invite_rule_opposite_sex_children:0 "異性の子供"
 mpie_invite_rule_nearby_player_children:0 "近くのプレイヤーの子供"
 
 # Meet Peers cooldown reset decision
 mpie_reset_meet_peers_cooldown_decision:0 "クールダウンをリセット：[GetActivityType('activity_playdate').GetNameNoTooltip]"
 mpie_reset_meet_peers_cooldown_decision_tooltip:0 "クールダウンを待たずに次の[GetActivityType('activity_playdate').GetName]を計画します"
 mpie_reset_meet_peers_cooldown_decision_desc:0 "#F 仲間にまた会うのに何年も待つ必要があるだろうか？今すぐもう一度招待しよう！#!"
 mpie_reset_meet_peers_cooldown_decision_confirm:0 "もう一度招待しよう！"
 mpie_reset_meet_peers_cooldown_decision_effect_tt:0 "次の[GetActivityType('activity_playdate').GetName]をすぐに計画できます。計画すると新しいクールダウンが始まります。"
 
 # Game rule: cooldown reset
 rule_mpie_meet_peers_cooldown_reset:0 "遊戯会のクールダウンリセット"
 setting_mpie_meet_peers_cooldown_reset_disabled:0 "無効"
 setting_mpie_meet_peers_cooldown_reset_disabled_desc:0 "遊戯会のクールダウンをリセットする決断は使用できません。"
 setting_mpie_meet_peers_cooldown_reset_enabled:0 "有効"
 setting_mpie_meet_peers_cooldown_reset_enabled_desc:0 "プレイヤーは決断で遊戯会のクールダウンをリセットし、待たずに次の遊戯会を計画できます。"
 
 # Game rule: cooldown length
 rule_mpie_meet_peers_cooldown:0 "遊戯会のクールダウン"
 setting_mpie_meet_peers_cooldown_1_year:0 "1年"
 setting_mpie_meet_peers_cooldown_1_year_desc:0 "遊戯会を主催した後、次の遊戯会を主催するまで1年待つ必要があります。"
 setting_mpie_meet_peers_cooldown_2_years:0 "2年"
 setting_mpie_meet_peers_cooldown_2_years_desc:0 "遊戯会を主催した後、次の遊戯会を主催するまで2年待つ必要があります。"
 setting_mpie_meet_peers_cooldown_3_years:0 "3年（基本ゲーム）"
 setting_mpie_meet_peers_cooldown_3_years_desc:0 "遊戯会を主催した後、次の遊戯会を主催するまで3年待つ必要があります（基本ゲームと同じ）。"

 # Game rule: AI Meet Peers and player children
 rule_mpie_ai_invites_players:0 "AIの遊戯会とプレイヤーの子供"
 setting_mpie_ai_invites_players_off:0 "無効"
 setting_mpie_ai_invites_players_off_desc:0 "AIの子供は基本ゲームと同様に遊戯会を主催し、近くのプレイヤーの子供を探しません。"
 setting_mpie_ai_invites_players_near:0 "近隣"
 setting_mpie_ai_invites_players_near_desc:0 "AIの子供はより頻繁に遊戯会を主催し（伯爵なら幼少期に約1回、皇帝なら最大4回）、同じ国や隣国、または近くに住むプレイヤーの子供を招待し、近くにいる場合はさらに積極的に主催します。"
 setting_mpie_ai_invites_players_near_and_faith:0 "近隣と同じ信仰"
 setting_mpie_ai_invites_players_near_and_faith_desc:0 "「近隣」に加えて、AIの子供はもっと遠くに住む同じ信仰のプレイヤーの子供も招待します。"

 # Game rule: Meet Peers guests at war
 rule_mpie_meet_peers_guests_at_war:0 "戦争中の遊戯会の客"
 setting_mpie_meet_peers_guests_at_war_disabled:0 "許可しない"
 setting_mpie_meet_peers_guests_at_war_disabled_desc:0 "基本ゲームと同様に、戦争中の子供は遊戯会に参加できません。"
 setting_mpie_meet_peers_guests_at_war_enabled:0 "プレイヤーに許可"
 setting_mpie_meet_peers_guests_at_war_enabled_desc:0 "戦争中のプレイヤーの子供も、客として遊戯会に参加できます。AIの子供は変わりません。"
 
 # Cooldown tooltip (common/trigger_localization/mpie_trigger_localization.txt)
 MPIE_MEET_PEERS_ON_COOLDOWN_FIRST:0 "[GetCurrentDateWithDiff( GetVarTimeRemaining( CHARACTER.MakeScope, 'mpie_meet_peers_cooldown') )]まで次の[GetActivityType('activity_playdate').GetName]を主催できません"
 MPIE_MEET_PEERS_ON_COOLDOWN_THIRD:0 "[CHARACTER.GetShortUIName]は[GetCurrentDateWithDiff( GetVarTimeRemaining( CHARACTER.MakeScope, 'mpie_meet_peers_cooldown') )]まで次の[GetActivityType('activity_playdate').GetName]を主催できません"

 # Game rule: court children host Meet Peers
 game_rule_category_mpie_meet_peers:0 "遊戯会"
 rule_mpie_court_children_meet_peers:0 "宮廷の子供による遊戯会"
 setting_mpie_court_children_meet_peers_off:0 "無効"
 setting_mpie_court_children_meet_peers_off_desc:0 "基本ゲームと同様に、称号を持つ子供だけが遊戯会を主催できます。"
 setting_mpie_court_children_meet_peers_kingdom:0 "王以上"
 setting_mpie_court_children_meet_peers_kingdom_desc:0 "王と皇帝は、宮廷にいる称号のない子供のために遊戯会を計画でき、その子供が主催します。年に一度、子供が自分から頼んでくることもあります。AIの君主は余裕があれば承諾し、プレイヤーは断ることができます。各宮廷で主催できるのは2年に1回までです。"
 setting_mpie_court_children_meet_peers_duchy:0 "公爵以上"
 setting_mpie_court_children_meet_peers_duchy_desc:0 "「王以上」に加えて、公爵の子供も対象になります。"
 mpie_meet_peers_refused_opinion:0 "遊戯会を断られた"

 # Court children host Meet Peers
 mpie_invite_rule_court_children:0 "宮廷と封臣の子供"
 mpie_invite_rule_close_family:0 "$activity_invite_rule_close_family$"
 mpie_invite_rule_extended_family:0 "$activity_invite_rule_extended_family$"
 mpie_host_child:0 "幼い主催者"
 mpie_host_child_for_host:0 "幼い主催者"
 mpie_host_child_promised:0 "$mpie_host_child$"
 mpie_host_child_promised_for_host:0 "$mpie_host_child$"
 MPIE_COURT_MEET_PEERS_ON_COOLDOWN_FIRST:0 "[GetCurrentDateWithDiff( GetVarTimeRemaining( CHARACTER.MakeScope, 'mpie_court_meet_peers_cooldown') )]まで、あなたの宮廷は子供のための次の[GetActivityType('activity_playdate').GetName]を主催できません"
 MPIE_COURT_MEET_PEERS_ON_COOLDOWN_THIRD:0 "[GetCurrentDateWithDiff( GetVarTimeRemaining( CHARACTER.MakeScope, 'mpie_court_meet_peers_cooldown') )]まで、[CHARACTER.GetShortUIName]の宮廷は子供のための次の[GetActivityType('activity_playdate').GetName]を主催できません"
 mpie_organized_my_meet_peers_opinion:0 "遊戯会を開いてくれた"
 mpie_meet_peers_family_opinion:0 "家族のために遊戯会を開いた"

 # Family first: guest acceptance (playdate guest_join_chance)
 MPIE_ACTIVITY_GUEST_HOST_SIBLING_REASON:0 "[ROOT.Char.GetSheHe|U]は主催者の兄弟姉妹である: $VALUE|=+0$"
 MPIE_ACTIVITY_GUEST_HOST_FAMILY_REASON:0 "[ROOT.Char.GetSheHe|U]は主催者の家族である: $VALUE|=+0$"

 # Meet Peers goals (intents)
 mpie_befriend_peer_intent:0 "仲間と友達になる"
 mpie_befriend_peer_intent_desc:0 "対象と[friends|E]になろうとする。二人とも到着すると、たいていは二人きりになれる機会が訪れ、いくつかの方法で相手の友情を勝ち取ることができる。相手がすでにあなたに好意を持っていれば、成功しやすくなる。"
 mpie_learn_from_peer_intent:0 "仲間から学ぶ"
 mpie_learn_from_peer_intent_desc:0 "対象から学ぼうとする。二人とも到着すると、たいていは教わる機会が訪れる。得られるのは、相手との差が最も大きい能力、または2番目に大きい能力の1ポイントだ。差が大きいほど、またあなたの[learning|E]が高いほど、成功しやすくなる。"
 mpie_role_model_intent:0 "憧れの仲間"
 mpie_role_model_intent_desc:0 "対象に憧れている。二人とも到着すると、たいていは相手の[personality_traits|E]の一つを身につける機会が訪れる。友人同士であったり、年齢が近かったりすると、成功しやすくなる。"

 # Befriend a Peer encounter
 mpie_peer.1001.t:0 "友情の芽生え"
 mpie_peer.1001.desc:0 "ここに着いてからずっと、[mpie_peer.GetTitledFirstName]ともっと仲良くなりたいと思っていた。今日ようやく、[mpie_peer.GetSheHe]が庭の壁にボールを当てて一人で遊んでいるところを見つけた。\n\n友達になりたいなら、今がその時だ！"
 mpie_peer.1001.a:0 "一緒に遊ぼうと誘う（[mpie_befriend_chance|0]%）"
 mpie_peer.1001.b:0 "お菓子を持っていってプレゼントする（[mpie_befriend_invest_chance|0]%）"
 mpie_peer.1001.f.prestige:0 "上座の私の隣に座るよう誘う（[mpie_befriend_invest_chance|0]%）"
 mpie_peer.1001.f.influence:0 "宮廷で[mpie_peer.GetHerHis]の家族の肩を持つと約束する（[mpie_befriend_invest_chance|0]%）"
 mpie_peer.1001.c:0 "涙が出るほど笑わせる（[mpie_befriend_trait_chance|0]%）"
 mpie_peer.1001.d:0 "古い樫の木まで競走だ！（[mpie_befriend_trait_chance|0]%）"
 mpie_peer.1001.e:0 "[mpie_peer.GetHerHis]の故郷のことをあれこれ尋ねる（[mpie_befriend_trait_chance|0]%）"
 mpie_befriend_success_tt:0 "友達になった！"
 mpie_befriend_failure_tt:0 "まだ友達ではない"

 # Learn from a Peer encounter
 mpie_peer.2001.t:0 "仲間からの教え"
 mpie_peer.2001.desc.diplomacy:0 "[mpie_peer.GetTitledFirstName]はいつも、何を言えばいいのかわかっているようだ。[mpie_peer.GetSheHe]が話すとほかの子供たちは耳を傾け、大人たちでさえ笑顔を向ける。\n\nコツを教えてもらえれば、私の[diplomacy|E]もずっと上達するはずだ。"
 mpie_peer.2001.desc.martial:0 "戦争ごっこをするといつも、命令を出すのは[mpie_peer.GetTitledFirstName]で、[mpie_peer.GetHerHis]の側が必ず勝つ。\n\nコツを教えてもらえれば、私の[martial|E]もずっと上達するはずだ。"
 mpie_peer.2001.desc.stewardship:0 "[mpie_peer.GetTitledFirstName]は、私たちがやり取りするビー玉やお菓子、銅貨を一つ残らず把握していて、なぜかいつも最初より多く手元に残している。\n\nコツを教えてもらえれば、私の[stewardship|E]もずっと上達するはずだ。"
 mpie_peer.2001.desc.intrigue:0 "ここで起こることは何でも、[mpie_peer.GetTitledFirstName]が真っ先に知っている。[mpie_peer.GetSheHe|U]はどんなささやきも聞き逃さず、どんな隠れ場所も見つけてしまう。\n\nコツを教えてもらえれば、私の[intrigue|E]もずっと上達するはずだ。"
 mpie_peer.2001.desc.learning:0 "[mpie_peer.GetTitledFirstName]は私の知る誰よりもたくさんの本を読んでいて、先生たちでさえ答えに詰まる質問にも答えられる。\n\nコツを教えてもらえれば、私の[learning|E]もずっと上達するはずだ。"
 mpie_peer.2001.desc.prowess:0 "[mpie_peer.GetTitledFirstName]は素早くて力も強く、どんなに強く打たれても木剣を落とさない。\n\nコツを教えてもらえれば、私の[prowess|E]もずっと上達するはずだ。"
 mpie_peer.2001.desc.gap:0 "\n\n#weak この能力では、[mpie_peer.GetSheHe]が私を[mpie_learn_gap|0]上回っている。#!"
 mpie_peer.2001.a.diplomacy:0 "[diplomacy|E]を教えてほしいと頼む（[mpie_learn_chance|0]%）"
 mpie_peer.2001.a.martial:0 "[martial|E]を教えてほしいと頼む（[mpie_learn_chance|0]%）"
 mpie_peer.2001.a.stewardship:0 "[stewardship|E]を教えてほしいと頼む（[mpie_learn_chance|0]%）"
 mpie_peer.2001.a.intrigue:0 "[intrigue|E]を教えてほしいと頼む（[mpie_learn_chance|0]%）"
 mpie_peer.2001.a.learning:0 "[learning|E]を教えてほしいと頼む（[mpie_learn_chance|0]%）"
 mpie_peer.2001.a.prowess:0 "[prowess|E]を教えてほしいと頼む（[mpie_learn_chance|0]%）"
 mpie_peer.2001.b.diplomacy:0 "代わりに[diplomacy|E]について尋ねる（[mpie_learn_chance_2|0]%）"
 mpie_peer.2001.b.martial:0 "代わりに[martial|E]について尋ねる（[mpie_learn_chance_2|0]%）"
 mpie_peer.2001.b.stewardship:0 "代わりに[stewardship|E]について尋ねる（[mpie_learn_chance_2|0]%）"
 mpie_peer.2001.b.intrigue:0 "代わりに[intrigue|E]について尋ねる（[mpie_learn_chance_2|0]%）"
 mpie_peer.2001.b.learning:0 "代わりに[learning|E]について尋ねる（[mpie_learn_chance_2|0]%）"
 mpie_peer.2001.b.prowess:0 "代わりに[prowess|E]について尋ねる（[mpie_learn_chance_2|0]%）"
 mpie_peer.2001.c:0 "まずは一緒に、知恵を授かれるよう祈る（[mpie_learn_invest_chance|0]%）"
 mpie_peer.2001.d.prestige:0 "私が誰なのかを思い出させる。断れるはずがない（[mpie_learn_invest_chance|0]%）"
 mpie_peer.2001.d.influence:0 "見返りに、宮廷で[mpie_peer.GetHerHis]の家族に便宜を図ると申し出る（[mpie_learn_invest_chance|0]%）"
 mpie_learn_success_tt:0 "実りある教え"
 mpie_learn_failure_tt:0 "実らなかった教え"
 mpie_learn_failure_effect_tt:0 "[mpie_peer.GetShortUIName]が教えてくれたが、身につかなかった"

 # Role Model encounter
 mpie_peer.3001.t:0 "憧れの存在"
 mpie_peer.3001.desc:0 "[mpie_peer.GetTitledFirstName]から目が離せない。誰もが[mpie_peer.GetSheHe]を「[mpie_modeled_trait.GetName( mpie_peer )|l]」だと認めていて、みんなそんなところに感心しているようだ。\n\n私もあんなふうになれるだろうか？"
 mpie_peer.3001.desc.second:0 "とはいえ、[mpie_peer.GetSheHe]は「[mpie_modeled_trait_2.GetName( mpie_peer )|l]」でもあるけれど…"
 mpie_peer.3001.a:0 "私も「[mpie_modeled_trait.GetName( ROOT.Char )|l]」になりたい！（[mpie_role_model_chance|0]%）"
 mpie_peer.3001.b:0 "むしろ「[mpie_modeled_trait_2.GetName( ROOT.Char )|l]」になるべきかも（[mpie_role_model_chance_2|0]%）"
 mpie_peer.3001.c:0 "「[mpie_modeled_trait.GetName( ROOT.Char )|l]」になれるよう、宮廷聖職者に助けを求める（[mpie_role_model_invest_chance|0]%）"
 mpie_role_model_success_tt:0 "仲間を見習って"
 mpie_role_model_failure_tt:0 "自分は自分"
 mpie_role_model_failure_effect_tt:0 "[mpie_peer.GetShortUIName]のようになろうとしたが、性に合わなかった"
 mpie_role_model_adopted_effect_tt:0 "[mpie_peer.GetShortUIName]を見習い、[mpie_adopted_trait.GetName( mpie_actor )]の[trait|E]を身につけた"
 mpie_role_model_rejected_tt:0 "叶わぬ望み"
 mpie_role_model_rejected_effect_tt:0 "結局、[mpie_adopted_trait.GetName( mpie_actor )]の[trait|E]を身につけることはできなかった"

 # Alternative pastime (instead of the goal; small sure reward)
 mpie_peer_pastime.games:0 "代わりに、ほかの子たちと遊びに行く"
 mpie_peer_pastime.chapel:0 "代わりに、こっそり礼拝堂へ行く"
 mpie_peer_pastime.quiet:0 "代わりに、静かな場所を探す"
 mpie_peer_pastime.showoff:0 "代わりに、みんなの前でいいところを見せる"

