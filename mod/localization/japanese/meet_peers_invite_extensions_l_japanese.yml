 mpie_peer_learn_failed_log:0 "[CHARACTER.GetTitledFirstName]は[TARGET_CHARACTER.GetTitledFirstName]から学ぼうとしたが、ついていけなかった"
 mpie_peer_role_model_log_title:0 "仲間を見習って"
 mpie_peer_role_model_log:0 "[CHARACTER.GetTitledFirstName]は[TARGET_CHARACTER.GetTitledFirstName]を見習うようになった"
 mpie_peer_role_model_failed_log_title:0 "自分は自分"
 mpie_peer_role_model_failed_log:0 "[CHARACTER.GetTitledFirstName]は[TARGET_CHARACTER.GetTitledFirstName]のようになろうとしたが、[CHARACTER.GetHerHim]の性に合わなかった"

 # Relationship reason
 mpie_friend_meet_peers_reason:0 "[CHARACTER.GetShortUIName|U]と[TARGET_CHARACTER.GetShortUIName]は[GetActivityType('activity_playdate').GetNameNoTooltip]で友達になった。"

 # Court children host Meet Peers (mpie_court_triggers.txt, events/activities/mpie_court_meet_peers_events.txt)
 mpie_court.0001.t:0 "宮廷でのお願い"
 mpie_court.0001.desc:0 "朝からずっと、[mpie_court_child.GetFirstName]が広間で私の後をついて回っている。とうとう[mpie_court_child.GetSheHe]が私の袖を引っ張った。\n\n「お願いです、[GetActivityType('activity_playdate').GetName]を開いてもいいですか？ 領国中から、いえ、もっと遠くからも、ほかの子供たちを招待したいんです！」\n\n私の宮廷で[GetActivityType('activity_playdate').GetNameNoTooltip]を開くと、およそ[gold_i][mpie_court_meet_peers_cost|0]かかるだろう。"
 mpie_court.0001.a:0 "もちろんだとも。手配しよう！"
 mpie_court.0001.b:0 "今年はだめだ、[mpie_court_child.GetFirstName]。"
 mpie_court_meet_peers_accept_tt:0 "[mpie_court_child.GetFirstName]を幼い主催者として、[GetActivityType('activity_playdate').GetName]の計画画面が開きます。1年以内であれば後で計画することもでき、画面上部の通知から計画画面を開けます"
 mpie_court_meet_peers_declined_tt:0 "[mpie_court_child.GetFirstName]は1年間、再び頼んでくることはありません"
 mpie_court_meet_peers_started_title:0 "[mpie_court_child.GetFirstName]が[GetActivityType('activity_playdate').GetNameNoTooltip]を主催"
 mpie_court_meet_peers_started_desc:0 "あなたが計画した[GetActivityType('activity_playdate').GetName]の主催者を、[mpie_court_child.GetFirstName]が引き継いだ"

 # End report for a player ruler (mpie_court.0100)
 mpie_court.0100.t:0 "[mpie_report_host.GetFirstName]の[GetActivityType('activity_playdate').GetNameNoTooltip]"
 mpie_court.0100.desc_guests_none:0 "[mpie_report_host.GetFirstName]のために計画した[GetActivityType('activity_playdate').GetName]が終わったが、ほかの子供は誰も来なかった。"
 mpie_court.0100.desc_guests_one:0 "[mpie_report_host.GetFirstName]のために計画した[GetActivityType('activity_playdate').GetName]が終わった。ほかの子供が一人来てくれた。"
 mpie_court.0100.desc_guests_many:0 "[mpie_report_host.GetFirstName]のために計画した[GetActivityType('activity_playdate').GetName]が終わった。ほかの子供が[mpie_report_guests|0]人来てくれた。"
 mpie_court.0100.desc_family_sibling_and_more:0 "その中には[mpie_report_sibling.GetFirstName]と、ほかに[mpie_report_family_others|0]人の家族もいた。"
 mpie_court.0100.desc_family_sibling:0 "[mpie_report_sibling.GetFirstName]もその中にいた。"
 mpie_court.0100.desc_family_relative_and_more:0 "その中には[mpie_report_relative.GetFirstName]と、ほかに[mpie_report_family_others|0]人の家族もいた。"
 mpie_court.0100.desc_family_relative:0 "家族の一人、[mpie_report_relative.GetFirstName]もその中にいた。"
 mpie_court.0100.desc_family_none:0 "家族からは誰も来なかった。"
 mpie_court.0100.desc_nothing:0 ""
