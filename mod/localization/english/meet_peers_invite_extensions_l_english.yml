 # Relationship reason
 mpie_friend_meet_peers_reason:0 "[CHARACTER.GetShortUIName|U] and [TARGET_CHARACTER.GetShortUIName] became friends at a [GetActivityType('activity_playdate').GetNameNoTooltip]."
