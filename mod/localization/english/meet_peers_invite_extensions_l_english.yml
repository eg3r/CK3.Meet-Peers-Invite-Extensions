 mpie_court.0100.desc_friends_one:0 "\n\n[mpie_report_host.GetFirstName] made friends with [mpie_report_friend.GetFirstName]."
 mpie_court.0100.desc_friends_none:0 "\n\n[mpie_report_host.GetFirstName] made no new friends this time."
 mpie_court.0100.desc_rival:0 "[mpie_report_host.GetFirstName] fell out with [mpie_report_rival.GetFirstName], though."
 mpie_court.0100.desc_rewards:0 "\n\nAs host, [mpie_report_host.GetFirstName] earned prestige, and every guest now thinks better of [mpie_report_host.GetHerHim]."
 mpie_court.0100.a:0 "I am glad to hear it."

