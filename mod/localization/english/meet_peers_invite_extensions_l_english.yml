 MPIE_COURT_MEET_PEERS_ON_COOLDOWN_FIRST:0 "Your court cannot host another [GetActivityType('activity_playdate').GetName] for a child until [GetCurrentDateWithDiff( GetVarTimeRemaining( CHARACTER.MakeScope, 'mpie_court_meet_peers_cooldown') )]"
 MPIE_COURT_MEET_PEERS_ON_COOLDOWN_THIRD:0 "[CHARACTER.GetShortUIName|U]'s court cannot host another [GetActivityType('activity_playdate').GetName] for a child until [GetCurrentDateWithDiff( GetVarTimeRemaining( CHARACTER.MakeScope, 'mpie_court_meet_peers_cooldown') )]"
 mpie_court.0001.t:0 "A Request at Court"
 mpie_court.0001.desc:0 "All morning, [mpie_court_child.GetFirstName] has been following me through the hall. At last [mpie_court_child.GetSheHe] tugs at my sleeve.\n\n"Please, may I host a [GetActivityType('activity_playdate').GetName]? I want to invite the other children, from all over the realm and beyond!"\n\nA [GetActivityType('activity_playdate').GetNameNoTooltip] at my court would cost about [mpie_court_meet_peers_cost|0][gold_i]."
 mpie_court.0001.a:0 "Of course, little one. I will arrange it!"
 mpie_court.0001.b:0 "Not this year, [mpie_court_child.GetFirstName]."
 mpie_court_meet_peers_accept_tt:0 "The [GetActivityType('activity_playdate').GetName] planner opens with [mpie_court_child.GetFirstName] as the Young Host. You can also plan it later, during the next year: a reminder at the top of the screen takes you there"
 mpie_court_meet_peers_declined_tt:0 "[mpie_court_child.GetFirstName] will not ask again for a year"
 mpie_court_meet_peers_started_title:0 "[mpie_court_child.GetFirstName] Hosts a [GetActivityType('activity_playdate').GetNameNoTooltip]"
 mpie_court_meet_peers_started_desc:0 "[mpie_court_child.GetFirstName] has taken over as host of the [GetActivityType('activity_playdate').GetName] you planned"
 mpie_meet_peers_refused_opinion:0 "Refused My Meet Peers"
 mpie_organized_my_meet_peers_opinion:0 "Organized My Meet Peers"
 mpie_meet_peers_family_opinion:0 "Organized a Meet Peers for Us"

