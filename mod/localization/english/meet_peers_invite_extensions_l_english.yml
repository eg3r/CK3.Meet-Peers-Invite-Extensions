l_english:
 # Meet Peers guest invite rules
 mpie_invite_rule_neighbors_children:0 "Neighboring Children"
 mpie_invite_rule_same_faith_children:0 "Children of the Same Faith"
 mpie_invite_rule_opposite_sex_children:0 "Children of the Opposite Sex"
 mpie_invite_rule_nearby_player_children:0 "Nearby Player Children"
 
 # Meet Peers cooldown reset decision
 mpie_reset_meet_peers_cooldown_decision:0 "Reset [GetActivityType('activity_playdate').GetNameNoTooltip] Cooldown"
 mpie_reset_meet_peers_cooldown_decision_tooltip:0 "Plan another [GetActivityType('activity_playdate').GetName] without waiting for the cooldown"
 mpie_reset_meet_peers_cooldown_decision_desc:0 "#F Why wait years to see my peers again? I will invite them back right away!#!"
 mpie_reset_meet_peers_cooldown_decision_confirm:0 "Invite them again!"
 mpie_reset_meet_peers_cooldown_decision_effect_tt:0 "Your next [GetActivityType('activity_playdate').GetName] can be planned right away. Planning it starts a new cooldown."
 
 # Game rule: cooldown reset
 rule_mpie_meet_peers_cooldown_reset:0 "Meet Peers Cooldown Reset"
 setting_mpie_meet_peers_cooldown_reset_disabled:0 "Disabled"
 setting_mpie_meet_peers_cooldown_reset_disabled_desc:0 "The Reset Meet Peers Cooldown decision is not available."
 setting_mpie_meet_peers_cooldown_reset_enabled:0 "Enabled"
 setting_mpie_meet_peers_cooldown_reset_enabled_desc:0 "Players can take the Reset Meet Peers Cooldown decision to plan the next Meet Peers without waiting for the cooldown."
 
 # Game rule: cooldown length
 rule_mpie_meet_peers_cooldown:0 "Meet Peers Cooldown"
 setting_mpie_meet_peers_cooldown_1_year:0 "1 Year"
 setting_mpie_meet_peers_cooldown_1_year_desc:0 "After hosting a Meet Peers, a character must wait 1 year before hosting the next one."
 setting_mpie_meet_peers_cooldown_2_years:0 "2 Years"
 setting_mpie_meet_peers_cooldown_2_years_desc:0 "After hosting a Meet Peers, a character must wait 2 years before hosting the next one."
 setting_mpie_meet_peers_cooldown_3_years:0 "3 Years (Vanilla)"
 setting_mpie_meet_peers_cooldown_3_years_desc:0 "After hosting a Meet Peers, a character must wait 3 years before hosting the next one, as in the base game."

 # Game rule: AI Meet Peers and player children
 rule_mpie_ai_invites_players:0 "AI Meet Peers and Player Children"
 setting_mpie_ai_invites_players_off:0 "Off"
 setting_mpie_ai_invites_players_off_desc:0 "AI children host Meet Peers as in the base game and do not look for nearby player children."
 setting_mpie_ai_invites_players_near:0 "Nearby"
 setting_mpie_ai_invites_players_near_desc:0 "AI children host Meet Peers more often (about once per childhood as counts, up to four times as emperors), invite player children from the same or a neighboring realm or living close by, and host more readily when one is near."
 setting_mpie_ai_invites_players_near_and_faith:0 "Nearby and Same Faith"
 setting_mpie_ai_invites_players_near_and_faith_desc:0 "As Nearby, and AI children also invite player children of their faith from further away."

 # Game rule: Meet Peers guests at war
 rule_mpie_meet_peers_guests_at_war:0 "Meet Peers Guests at War"
 setting_mpie_meet_peers_guests_at_war_disabled:0 "Not Allowed"
 setting_mpie_meet_peers_guests_at_war_disabled_desc:0 "As in the base game, children who are at war cannot attend a Meet Peers."
 setting_mpie_meet_peers_guests_at_war_enabled:0 "Allowed for Players"
 setting_mpie_meet_peers_guests_at_war_enabled_desc:0 "Player children who are at war can still attend Meet Peers as guests. AI children are unchanged."

 # Game rule: court children host Meet Peers
 game_rule_category_mpie_meet_peers:0 "Meet Peers"
 rule_mpie_court_children_meet_peers:0 "Court Children Host Meet Peers"
 setting_mpie_court_children_meet_peers_off:0 "Off"
 setting_mpie_court_children_meet_peers_off_desc:0 "As in the base game, only children who hold a title can host a Meet Peers."
 setting_mpie_court_children_meet_peers_kingdom:0 "Kings and Above"
 setting_mpie_court_children_meet_peers_kingdom_desc:0 "Kings and emperors can plan a Meet Peers for a child at their court who holds no title, and the child hosts it. Once a year a child may also ask: AI rulers say yes if they can afford it, players can refuse. Each court hosts at most one every 2 years."
 setting_mpie_court_children_meet_peers_duchy:0 "Dukes and Above"
 setting_mpie_court_children_meet_peers_duchy_desc:0 "As Kings and Above, and the children of dukes too."
 
 # Cooldown tooltip (common/trigger_localization/mpie_trigger_localization.txt)
 MPIE_MEET_PEERS_ON_COOLDOWN_FIRST:0 "You cannot host another [GetActivityType('activity_playdate').GetName] until [GetCurrentDateWithDiff( GetVarTimeRemaining( CHARACTER.MakeScope, 'mpie_meet_peers_cooldown') )]"
 MPIE_MEET_PEERS_ON_COOLDOWN_THIRD:0 "[CHARACTER.GetShortUIName|U] cannot host another [GetActivityType('activity_playdate').GetName] until [GetCurrentDateWithDiff( GetVarTimeRemaining( CHARACTER.MakeScope, 'mpie_meet_peers_cooldown') )]"

 # Meet Peers goals (intents)
 mpie_befriend_peer_intent:0 "Befriend a Peer"
 mpie_befriend_peer_intent_desc:0 "You want to become [friends|E] with your target. Once you have both arrived, a moment alone with them usually comes up, with a few ways to win their friendship. It is more likely if they already like you."
 mpie_learn_from_peer_intent:0 "Learn from a Peer"
 mpie_learn_from_peer_intent_desc:0 "You want to learn from your target. Once you have both arrived, a lesson usually comes up: a point in the skill where they are furthest ahead of you, or in their second-best. The bigger the gap and the better your [learning|E], the better the chance."
 mpie_role_model_intent:0 "Role Model"
 mpie_role_model_intent_desc:0 "You look up to your target. Once you have both arrived, a moment usually comes up to take on one of their [personality_traits|E]. It is more likely if you are friends or close in age."

 # Befriend a Peer encounter
 mpie_peer.1001.t:0 "A Friend in the Making"
 mpie_peer.1001.desc:0 "Ever since I arrived, I have wanted to get to know [mpie_peer.GetTitledFirstName] better. Today I finally find [mpie_peer.GetHerHim] alone, bouncing a ball against the garden wall.\n\nIf I want us to be friends, this is my chance!"
 mpie_peer.1001.a:0 "Ask [mpie_peer.GetHerHim] to play with me ([mpie_befriend_chance|0]%)"
 mpie_peer.1001.b:0 "Bring [mpie_peer.GetHerHim] some sweets as a gift ([mpie_befriend_invest_chance|0]%)"
 mpie_peer.1001.f.prestige:0 "Invite [mpie_peer.GetHerHim] to sit beside me at the high table ([mpie_befriend_invest_chance|0]%)"
 mpie_peer.1001.f.influence:0 "Promise to speak for [mpie_peer.GetHerHis] family at court ([mpie_befriend_invest_chance|0]%)"
 mpie_peer.1001.c:0 "Make [mpie_peer.GetHerHim] laugh until [mpie_peer.GetSheHe] cries ([mpie_befriend_trait_chance|0]%)"
 mpie_peer.1001.d:0 "Race [mpie_peer.GetHerHim] to the old oak tree! ([mpie_befriend_trait_chance|0]%)"
 mpie_peer.1001.e:0 "Ask [mpie_peer.GetHerHim] all about [mpie_peer.GetHerHis] home ([mpie_befriend_trait_chance|0]%)"
 mpie_befriend_success_tt:0 "Friends!"
 mpie_befriend_failure_tt:0 "Not Friends Yet"

 # Learn from a Peer encounter
 mpie_peer.2001.t:0 "A Lesson from a Peer"
 mpie_peer.2001.desc.diplomacy:0 "[mpie_peer.GetTitledFirstName] always seems to know what to say. The other children listen when [mpie_peer.GetSheHe] speaks, and even the grown-ups smile at [mpie_peer.GetHerHim].\n\nIf [mpie_peer.GetSheHe] showed me how, I could get much better at [diplomacy|E]."
 mpie_peer.2001.desc.martial:0 "Whenever we play at war, [mpie_peer.GetTitledFirstName] is the one giving the orders, and [mpie_peer.GetHerHis] side always wins.\n\nIf [mpie_peer.GetSheHe] showed me how, I could get much better at [martial|E]."
 mpie_peer.2001.desc.stewardship:0 "[mpie_peer.GetTitledFirstName] keeps track of every marble, sweet and copper coin we trade, and somehow always ends up with more than [mpie_peer.GetSheHe] started with.\n\nIf [mpie_peer.GetSheHe] showed me how, I could get much better at [stewardship|E]."
 mpie_peer.2001.desc.intrigue:0 "Nothing happens here without [mpie_peer.GetTitledFirstName] knowing about it first. [mpie_peer.GetSheHe|U] hears every whisper and finds every hiding place.\n\nIf [mpie_peer.GetSheHe] showed me how, I could get much better at [intrigue|E]."
 mpie_peer.2001.desc.learning:0 "[mpie_peer.GetTitledFirstName] has read more books than anyone I know, and [mpie_peer.GetSheHe] can answer questions that stump even our tutors.\n\nIf [mpie_peer.GetSheHe] showed me how, I could get much better at [learning|E]."
 mpie_peer.2001.desc.prowess:0 "[mpie_peer.GetTitledFirstName] is quick, strong, and never drops [mpie_peer.GetHerHis] wooden sword, no matter how hard the blow.\n\nIf [mpie_peer.GetSheHe] showed me how, I could get much better at [prowess|E]."
 mpie_peer.2001.desc.gap:0 "\n\n#weak [mpie_peer.GetSheHe|U] is [mpie_learn_gap|0] ahead of me.#!"
 mpie_peer.2001.a.diplomacy:0 "Ask [mpie_peer.GetHerHim] to teach me [diplomacy|E] ([mpie_learn_chance|0]%)"
 mpie_peer.2001.a.martial:0 "Ask [mpie_peer.GetHerHim] to teach me [martial|E] ([mpie_learn_chance|0]%)"
 mpie_peer.2001.a.stewardship:0 "Ask [mpie_peer.GetHerHim] to teach me [stewardship|E] ([mpie_learn_chance|0]%)"
 mpie_peer.2001.a.intrigue:0 "Ask [mpie_peer.GetHerHim] to teach me [intrigue|E] ([mpie_learn_chance|0]%)"
 mpie_peer.2001.a.learning:0 "Ask [mpie_peer.GetHerHim] to teach me [learning|E] ([mpie_learn_chance|0]%)"
 mpie_peer.2001.a.prowess:0 "Ask [mpie_peer.GetHerHim] to teach me [prowess|E] ([mpie_learn_chance|0]%)"
 mpie_peer.2001.b.diplomacy:0 "Ask about [diplomacy|E] instead ([mpie_learn_chance_2|0]%)"
 mpie_peer.2001.b.martial:0 "Ask about [martial|E] instead ([mpie_learn_chance_2|0]%)"
 mpie_peer.2001.b.stewardship:0 "Ask about [stewardship|E] instead ([mpie_learn_chance_2|0]%)"
 mpie_peer.2001.b.intrigue:0 "Ask about [intrigue|E] instead ([mpie_learn_chance_2|0]%)"
 mpie_peer.2001.b.learning:0 "Ask about [learning|E] instead ([mpie_learn_chance_2|0]%)"
 mpie_peer.2001.b.prowess:0 "Ask about [prowess|E] instead ([mpie_learn_chance_2|0]%)"
 mpie_peer.2001.c:0 "Say a prayer for wisdom together first ([mpie_learn_invest_chance|0]%)"
 mpie_peer.2001.d.prestige:0 "Remind [mpie_peer.GetHerHim] who I am, [mpie_peer.GetSheHe] will not refuse me ([mpie_learn_invest_chance|0]%)"
 mpie_peer.2001.d.influence:0 "Offer [mpie_peer.GetHerHis] family my favor at court in return ([mpie_learn_invest_chance|0]%)"
 mpie_learn_success_tt:0 "A Lesson Learned"
 mpie_learn_failure_tt:0 "A Lesson Lost"
 mpie_learn_failure_effect_tt:0 "[mpie_peer.GetShortUIName] tried to teach you, but it did not stick"

 # Role Model encounter
 mpie_peer.3001.t:0 "Someone to Look Up To"
 mpie_peer.3001.desc:0 "I can't stop watching [mpie_peer.GetTitledFirstName]. Everyone notices how [mpie_modeled_trait.GetName( mpie_peer )|l] [mpie_peer.GetSheHe] is, and they all seem to admire [mpie_peer.GetHerHim] for it.\n\nMaybe I could be more like that?"
 mpie_peer.3001.desc.second:0 "Then again, [mpie_peer.GetSheHe] can be so [mpie_modeled_trait_2.GetName( mpie_peer )|l], too..."
 mpie_peer.3001.a:0 "I want to be [mpie_modeled_trait.GetName( ROOT.Char )|l] too! ([mpie_role_model_chance|0]%)"
 mpie_peer.3001.b:0 "Maybe I should be [mpie_modeled_trait_2.GetName( ROOT.Char )|l] instead ([mpie_role_model_chance_2|0]%)"
 mpie_peer.3001.c:0 "Ask the chaplain to help me become [mpie_modeled_trait.GetName( ROOT.Char )|l] ([mpie_role_model_invest_chance|0]%)"
 mpie_role_model_success_tt:0 "Taking After a Peer"
 mpie_role_model_failure_tt:0 "Still Myself"
 mpie_role_model_failure_effect_tt:0 "You tried to be more like [mpie_peer.GetShortUIName], but it did not suit you"
 mpie_role_model_adopted_effect_tt:0 "Took on the [mpie_adopted_trait.GetName( mpie_actor )] [trait|E] from [mpie_peer.GetShortUIName]"
 mpie_role_model_rejected_tt:0 "Not Meant to Be"
 mpie_role_model_rejected_effect_tt:0 "You could not take on the [mpie_adopted_trait.GetName( mpie_actor )] [trait|E] after all"

