 # Court children host Meet Peers (mpie_court_triggers.txt, events/activities/mpie_court_meet_peers_events.txt)
 mpie_court.0001.t:0 "궁정에서의 부탁"
 mpie_court.0001.desc:0 "아침 내내 [mpie_court_child.GetFirstName](이)가 전당 여기저기로 나를 졸졸 따라다녔다. 마침내 [mpie_court_child.GetSheHe]가 내 소매를 잡아당긴다.\n\n"제발요, 저도 [GetActivityType('activity_playdate').GetName] 열어도 돼요? 봉역 곳곳은 물론이고 그 너머에 사는 아이들까지 다 초대하고 싶어요!"\n\n내 궁정에서 여는 [GetActivityType('activity_playdate').GetNameNoTooltip]에는 [mpie_court_meet_peers_cost|0][gold_i] 정도가 들 것이다."
 mpie_court.0001.a:0 "물론이지, 얘야. 내가 마련해 주마!"
 mpie_court.0001.b:0 "올해는 안 된다, [mpie_court_child.GetFirstName]."
 mpie_court_meet_peers_accept_tt:0 "[GetActivityType('activity_playdate').GetName] 계획 화면이 열리고 [mpie_court_child.GetFirstName](이)가 어린 주최자로 지정됨. 앞으로 1년 안에 나중에 계획할 수도 있으며, 화면 상단의 알림을 누르면 계획 화면으로 이동함"
 mpie_court_meet_peers_declined_tt:0 "[mpie_court_child.GetFirstName](은)는 1년 동안 다시 부탁하지 않음"
 mpie_court_meet_peers_started_title:0 "[mpie_court_child.GetFirstName]의 [GetActivityType('activity_playdate').GetNameNoTooltip] 주최"
 mpie_court_meet_peers_started_desc:0 "[mpie_court_child.GetFirstName](이)가 당신이 계획한 [GetActivityType('activity_playdate').GetName]의 주최자 자리를 넘겨받음"

