l_korean:
 # Meet Peers guest invite rules
 mpie_invite_rule_neighbors_children:0 "이웃 아이들"
 mpie_invite_rule_same_faith_children:0 "같은 신앙의 아이들"
 mpie_invite_rule_opposite_sex_children:0 "이성의 아이들"
 mpie_invite_rule_nearby_player_children:0 "근처의 플레이어 아이들"
 
 # Meet Peers cooldown reset decision
 mpie_reset_meet_peers_cooldown_decision:0 "재사용 대기시간 초기화: [GetActivityType('activity_playdate').GetNameNoTooltip]"
 mpie_reset_meet_peers_cooldown_decision_tooltip:0 "재사용 대기시간을 기다리지 않고 [GetActivityType('activity_playdate').GetName]을(를) 다시 계획합니다"
 mpie_reset_meet_peers_cooldown_decision_desc:0 "#F 또래들을 다시 만나려고 몇 년이나 기다릴 필요가 있을까? 지금 바로 다시 초대하겠어!#!"
 mpie_reset_meet_peers_cooldown_decision_confirm:0 "다시 초대하자!"
 mpie_reset_meet_peers_cooldown_decision_effect_tt:0 "다음 [GetActivityType('activity_playdate').GetName]을(를) 바로 계획할 수 있습니다. 계획하면 새로운 재사용 대기시간이 시작됩니다."
 
 # Game rule: cooldown reset
 rule_mpie_meet_peers_cooldown_reset:0 "또래 회합 재사용 대기시간 초기화"
 setting_mpie_meet_peers_cooldown_reset_disabled:0 "비활성화"
 setting_mpie_meet_peers_cooldown_reset_disabled_desc:0 "또래 회합 재사용 대기시간 초기화 결정을 사용할 수 없습니다."
 setting_mpie_meet_peers_cooldown_reset_enabled:0 "활성화"
 setting_mpie_meet_peers_cooldown_reset_enabled_desc:0 "플레이어는 또래 회합 재사용 대기시간 초기화 결정을 내려 기다리지 않고 다음 회합을 계획할 수 있습니다."
 
 # Game rule: cooldown length
 rule_mpie_meet_peers_cooldown:0 "또래 회합 재사용 대기시간"
 setting_mpie_meet_peers_cooldown_1_year:0 "1년"
 setting_mpie_meet_peers_cooldown_1_year_desc:0 "또래 회합을 주최한 후 다음 회합을 주최하려면 1년을 기다려야 합니다."
 setting_mpie_meet_peers_cooldown_2_years:0 "2년"
 setting_mpie_meet_peers_cooldown_2_years_desc:0 "또래 회합을 주최한 후 다음 회합을 주최하려면 2년을 기다려야 합니다."
 setting_mpie_meet_peers_cooldown_3_years:0 "3년 (기본 게임)"
 setting_mpie_meet_peers_cooldown_3_years_desc:0 "또래 회합을 주최한 후 다음 회합을 주최하려면 기본 게임과 같이 3년을 기다려야 합니다."

 # Game rule: AI Meet Peers and player children
 rule_mpie_ai_invites_players:0 "AI 또래 회합과 플레이어 아이들"
 setting_mpie_ai_invites_players_off:0 "끄기"
 setting_mpie_ai_invites_players_off_desc:0 "AI 아이들은 기본 게임처럼 또래 회합을 주최하며 근처의 플레이어 아이들을 찾지 않습니다."
 setting_mpie_ai_invites_players_near:0 "근처"
 setting_mpie_ai_invites_players_near_desc:0 "AI 아이들은 또래 회합을 더 자주 주최하고(백작은 어린 시절 약 1번, 황제는 최대 4번), 같은 나라나 이웃 나라, 또는 가까이 사는 플레이어 아이들을 초대하며, 근처에 있으면 더 적극적으로 주최합니다."
 setting_mpie_ai_invites_players_near_and_faith:0 "근처 및 같은 신앙"
 setting_mpie_ai_invites_players_near_and_faith_desc:0 "'근처'와 같으며, AI 아이들은 더 멀리 사는 같은 신앙의 플레이어 아이들도 초대합니다."

 # Game rule: Meet Peers guests at war
 rule_mpie_meet_peers_guests_at_war:0 "전쟁 중인 또래 회합 손님"
 setting_mpie_meet_peers_guests_at_war_disabled:0 "허용 안 함"
 setting_mpie_meet_peers_guests_at_war_disabled_desc:0 "기본 게임처럼 전쟁 중인 아이들은 또래 회합에 참석할 수 없습니다."
 setting_mpie_meet_peers_guests_at_war_enabled:0 "플레이어에게 허용"
 setting_mpie_meet_peers_guests_at_war_enabled_desc:0 "전쟁 중인 플레이어 아이들도 손님으로 또래 회합에 참석할 수 있습니다. AI 아이들은 그대로입니다."
 
 # Cooldown tooltip (common/trigger_localization/mpie_trigger_localization.txt)
 MPIE_MEET_PEERS_ON_COOLDOWN_FIRST:0 "[GetCurrentDateWithDiff( GetVarTimeRemaining( CHARACTER.MakeScope, 'mpie_meet_peers_cooldown') )]까지 다음 [GetActivityType('activity_playdate').GetName]을(를) 주최할 수 없습니다"
 MPIE_MEET_PEERS_ON_COOLDOWN_THIRD:0 "[CHARACTER.GetShortUIName]은(는) [GetCurrentDateWithDiff( GetVarTimeRemaining( CHARACTER.MakeScope, 'mpie_meet_peers_cooldown') )]까지 다음 [GetActivityType('activity_playdate').GetName]을(를) 주최할 수 없습니다"

 # Game rule: court children host Meet Peers
 game_rule_category_mpie_meet_peers:0 "또래 회합"
 rule_mpie_court_children_meet_peers:0 "궁정 아이들의 또래 회합"
 setting_mpie_court_children_meet_peers_off:0 "끄기"
 setting_mpie_court_children_meet_peers_off_desc:0 "기본 게임처럼 작위를 가진 아이만 또래 회합을 주최할 수 있습니다."
 setting_mpie_court_children_meet_peers_kingdom:0 "왕 이상"
 setting_mpie_court_children_meet_peers_kingdom_desc:0 "왕과 황제는 궁정에 사는 작위 없는 자녀를 위해 또래 회합을 계획할 수 있으며, 그 자녀가 주최합니다. 1년에 한 번 자녀가 직접 부탁할 수도 있습니다. AI 통치자는 여유가 있으면 승낙하고, 플레이어는 거절할 수 있습니다. 각 궁정은 2년에 한 번까지만 주최합니다."
 setting_mpie_court_children_meet_peers_duchy:0 "공작 이상"
 setting_mpie_court_children_meet_peers_duchy_desc:0 "'왕 이상'과 같으며, 공작의 자녀도 포함됩니다."
 mpie_meet_peers_refused_opinion:0 "또래 회합을 거절함"

 # Court children host Meet Peers
 mpie_invite_rule_court_children:0 "궁정과 봉신의 자녀"
 mpie_invite_rule_close_family:0 "$activity_invite_rule_close_family$"
 mpie_invite_rule_extended_family:0 "$activity_invite_rule_extended_family$"
 mpie_host_child:0 "어린 주최자"
 mpie_host_child_for_host:0 "어린 주최자"
 mpie_host_child_promised:0 "$mpie_host_child$"
 mpie_host_child_promised_for_host:0 "$mpie_host_child$"
 MPIE_COURT_MEET_PEERS_ON_COOLDOWN_FIRST:0 "[GetCurrentDateWithDiff( GetVarTimeRemaining( CHARACTER.MakeScope, 'mpie_court_meet_peers_cooldown') )]까지 당신의 궁정은 아이를 위한 다음 [GetActivityType('activity_playdate').GetName]을(를) 주최할 수 없습니다"
 MPIE_COURT_MEET_PEERS_ON_COOLDOWN_THIRD:0 "[GetCurrentDateWithDiff( GetVarTimeRemaining( CHARACTER.MakeScope, 'mpie_court_meet_peers_cooldown') )]까지 [CHARACTER.GetShortUIName]의 궁정은 아이를 위한 다음 [GetActivityType('activity_playdate').GetName]을(를) 주최할 수 없습니다"
 mpie_organized_my_meet_peers_opinion:0 "또래 회합을 열어 줌"
 mpie_meet_peers_family_opinion:0 "가족을 위해 또래 회합을 엶"

 # Family first: guest acceptance (playdate guest_join_chance)
 MPIE_ACTIVITY_GUEST_HOST_SIBLING_REASON:0 "[ROOT.Char.GetSheHe|U]가 주최자의 형제자매임: $VALUE|=+0$"
 MPIE_ACTIVITY_GUEST_HOST_FAMILY_REASON:0 "[ROOT.Char.GetSheHe|U]가 주최자의 가족임: $VALUE|=+0$"

 # Meet Peers goals (intents)
 mpie_befriend_peer_intent:0 "또래와 친구 되기"
 mpie_befriend_peer_intent_desc:0 "대상과 [friends|E]가 되고 싶어 합니다. 두 사람 모두 도착하면 대개 단둘이 있을 기회가 찾아오고, 우정을 얻을 방법도 몇 가지 생깁니다. 대상이 이미 당신을 좋아한다면 친구가 될 가능성이 더 높습니다."
 mpie_learn_from_peer_intent:0 "또래에게 배우기"
 mpie_learn_from_peer_intent_desc:0 "대상에게서 무언가를 배우고 싶어 합니다. 두 사람 모두 도착하면 대개 배울 기회가 찾아옵니다. 대상이 당신보다 가장 크게 앞선 능력이나 두 번째로 크게 앞선 능력이 1 오를 수 있습니다. 격차가 클수록, 당신의 [learning|E] 능력이 높을수록 가능성이 높아집니다."
 mpie_role_model_intent:0 "또래 본받기"
 mpie_role_model_intent_desc:0 "대상을 우러러봅니다. 두 사람 모두 도착하면 대개 대상의 [personality_traits|E] 중 하나를 본받을 기회가 찾아옵니다. 서로 친구이거나 나이가 비슷하다면 가능성이 더 높습니다."

 # Befriend a Peer encounter
 mpie_peer.1001.t:0 "싹트는 우정"
 mpie_peer.1001.desc:0 "이곳에 도착한 뒤로 줄곧 [mpie_peer.GetTitledFirstName](와)과 더 가까워지고 싶었다. 그리고 오늘, 마침내 정원 담벼락에 혼자 공을 튀기고 있는 [mpie_peer.GetHerHim]를 발견했다.\n\n친구가 되고 싶다면 지금이 기회야!"
 mpie_peer.1001.a:0 "같이 놀자고 해 보자 ([mpie_befriend_chance|0]%)"
 mpie_peer.1001.b:0 "선물로 단것을 좀 가져다주자 ([mpie_befriend_invest_chance|0]%)"
 mpie_peer.1001.f.prestige:0 "상석의 내 옆자리에 앉으라고 권하자 ([mpie_befriend_invest_chance|0]%)"
 mpie_peer.1001.f.influence:0 "궁정에서 [mpie_peer.GetHerHis] 가문의 편을 들어 주겠다고 약속하자 ([mpie_befriend_invest_chance|0]%)"
 mpie_peer.1001.c:0 "눈물이 쏙 빠지도록 웃겨 주자 ([mpie_befriend_trait_chance|0]%)"
 mpie_peer.1001.d:0 "저 늙은 참나무까지 누가 먼저 가나 시합하자! ([mpie_befriend_trait_chance|0]%)"
 mpie_peer.1001.e:0 "[mpie_peer.GetHerHis] 고향 이야기를 이것저것 물어보자 ([mpie_befriend_trait_chance|0]%)"
 mpie_befriend_success_tt:0 "친구가 됨!"
 mpie_befriend_failure_tt:0 "아직은 친구가 아님"

 # Learn from a Peer encounter
 mpie_peer.2001.t:0 "또래의 가르침"
 mpie_peer.2001.desc.diplomacy:0 "[mpie_peer.GetTitledFirstName](은)는 언제나 무슨 말을 해야 할지 아는 것 같다. [mpie_peer.GetSheHe]가 입을 열면 다른 아이들은 귀를 기울이고, 어른들조차 [mpie_peer.GetHerHim]를 보며 미소 짓는다.\n\n[mpie_peer.GetSheHe]가 요령을 알려 준다면, 내 [diplomacy|E] 능력도 훨씬 좋아질 텐데."
 mpie_peer.2001.desc.martial:0 "전쟁놀이를 할 때면 늘 [mpie_peer.GetTitledFirstName](이)가 명령을 내리고, [mpie_peer.GetHerHis] 편이 언제나 이긴다.\n\n[mpie_peer.GetSheHe]가 요령을 알려 준다면, 내 [martial|E] 능력도 훨씬 좋아질 텐데."
 mpie_peer.2001.desc.stewardship:0 "[mpie_peer.GetTitledFirstName](은)는 우리가 주고받는 구슬이며 사탕이며 구리 동전 한 닢까지 빠짐없이 기억하고, 어찌 된 일인지 늘 처음보다 더 많이 가진 채로 끝낸다.\n\n[mpie_peer.GetSheHe]가 요령을 알려 준다면, 내 [stewardship|E] 능력도 훨씬 좋아질 텐데."
 mpie_peer.2001.desc.intrigue:0 "이곳에서 [mpie_peer.GetTitledFirstName](이)가 먼저 알지 못하는 일은 하나도 없다. [mpie_peer.GetSheHe|U]는 온갖 속삭임을 다 엿듣고, 숨을 곳이란 숨을 곳은 다 찾아낸다.\n\n[mpie_peer.GetSheHe]가 요령을 알려 준다면, 내 [intrigue|E] 능력도 훨씬 좋아질 텐데."
 mpie_peer.2001.desc.learning:0 "[mpie_peer.GetTitledFirstName](은)는 내가 아는 누구보다 책을 많이 읽었고, 가정교사들조차 쩔쩔매는 질문에도 척척 대답한다.\n\n[mpie_peer.GetSheHe]가 요령을 알려 준다면, 내 [learning|E] 능력도 훨씬 좋아질 텐데."
 mpie_peer.2001.desc.prowess:0 "[mpie_peer.GetTitledFirstName](은)는 날쌔고 힘이 세서, 아무리 세게 얻어맞아도 목검을 절대 놓치지 않는다.\n\n[mpie_peer.GetSheHe]가 요령을 알려 준다면, 내 [prowess|E]도 훨씬 좋아질 텐데."
 mpie_peer.2001.desc.gap:0 "\n\n#weak [mpie_peer.GetSheHe|U]는 나보다 [mpie_learn_gap|0]만큼 앞서 있다.#!"
 mpie_peer.2001.a.diplomacy:0 "[diplomacy|E]에 대해 가르쳐 달라고 부탁하자 ([mpie_learn_chance|0]%)"
 mpie_peer.2001.a.martial:0 "[martial|E]에 대해 가르쳐 달라고 부탁하자 ([mpie_learn_chance|0]%)"
 mpie_peer.2001.a.stewardship:0 "[stewardship|E]에 대해 가르쳐 달라고 부탁하자 ([mpie_learn_chance|0]%)"
 mpie_peer.2001.a.intrigue:0 "[intrigue|E]에 대해 가르쳐 달라고 부탁하자 ([mpie_learn_chance|0]%)"
 mpie_peer.2001.a.learning:0 "[learning|E]에 대해 가르쳐 달라고 부탁하자 ([mpie_learn_chance|0]%)"
 mpie_peer.2001.a.prowess:0 "[prowess|E]에 대해 가르쳐 달라고 부탁하자 ([mpie_learn_chance|0]%)"
 mpie_peer.2001.b.diplomacy:0 "대신 [diplomacy|E]에 대해 물어보자 ([mpie_learn_chance_2|0]%)"
 mpie_peer.2001.b.martial:0 "대신 [martial|E]에 대해 물어보자 ([mpie_learn_chance_2|0]%)"
 mpie_peer.2001.b.stewardship:0 "대신 [stewardship|E]에 대해 물어보자 ([mpie_learn_chance_2|0]%)"
 mpie_peer.2001.b.intrigue:0 "대신 [intrigue|E]에 대해 물어보자 ([mpie_learn_chance_2|0]%)"
 mpie_peer.2001.b.learning:0 "대신 [learning|E]에 대해 물어보자 ([mpie_learn_chance_2|0]%)"
 mpie_peer.2001.b.prowess:0 "대신 [prowess|E]에 대해 물어보자 ([mpie_learn_chance_2|0]%)"
 mpie_peer.2001.c:0 "먼저 함께 지혜를 구하는 기도를 올리자 ([mpie_learn_invest_chance|0]%)"
 mpie_peer.2001.d.prestige:0 "내가 누군지 일깨워 주자. 감히 거절하지는 못할걸 ([mpie_learn_invest_chance|0]%)"
 mpie_peer.2001.d.influence:0 "그 대가로 궁정에서 [mpie_peer.GetHerHis] 가문을 잘 봐주겠다고 제안하자 ([mpie_learn_invest_chance|0]%)"
 mpie_learn_success_tt:0 "배움을 얻음"
 mpie_learn_failure_tt:0 "놓쳐 버린 배움"
 mpie_learn_failure_effect_tt:0 "[mpie_peer.GetShortUIName](이)가 가르쳐 주려 했지만, 머리에 남지 않음"

 # Role Model encounter
 mpie_peer.3001.t:0 "닮고 싶은 아이"
 mpie_peer.3001.desc:0 "[mpie_peer.GetTitledFirstName]에게서 눈을 뗄 수가 없다. [mpie_peer.GetSheHe]가 얼마나 [mpie_modeled_trait.GetName( mpie_peer )|l] 아이인지 모두가 알고 있고, 다들 그 점 때문에 [mpie_peer.GetHerHim]를 우러러보는 것 같다.\n\n나도 저렇게 될 수 있지 않을까?"
 mpie_peer.3001.desc.second:0 "하지만 [mpie_peer.GetSheHe]는 몹시 [mpie_modeled_trait_2.GetName( mpie_peer )|l] 모습을 보일 때도 있는데..."
 mpie_peer.3001.a:0 "나도 [mpie_modeled_trait.GetName( ROOT.Char )|l] 아이가 될 거야! ([mpie_role_model_chance|0]%)"
 mpie_peer.3001.b:0 "아니면 [mpie_modeled_trait_2.GetName( ROOT.Char )|l] 아이가 되는 게 나을지도 ([mpie_role_model_chance_2|0]%)"
 mpie_peer.3001.c:0 "[mpie_modeled_trait.GetName( ROOT.Char )|l] 아이가 되도록 도와 달라고 궁정 사제에게 부탁하자 ([mpie_role_model_invest_chance|0]%)"
 mpie_role_model_success_tt:0 "또래를 닮아 감"
 mpie_role_model_failure_tt:0 "그래도 나는 나"
 mpie_role_model_failure_effect_tt:0 "[mpie_peer.GetShortUIName]처럼 되어 보려 했지만, 당신에게는 맞지 않았음"
 mpie_role_model_adopted_effect_tt:0 "[mpie_peer.GetShortUIName](을)를 본받아 [mpie_adopted_trait.GetName( mpie_actor )] [trait|E]을 얻음"
 mpie_role_model_rejected_tt:0 "이루지 못한 바람"
 mpie_role_model_rejected_effect_tt:0 "결국 [mpie_adopted_trait.GetName( mpie_actor )] [trait|E]을 얻지 못함"

 # Alternative pastime (instead of the goal; small sure reward)
 mpie_peer_pastime.games:0 "대신 다른 아이들과 놀러 달려가자"
