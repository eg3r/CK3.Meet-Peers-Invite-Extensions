 mpie_court.0100.t:0 "[mpie_report_host.GetFirstName]의 [GetActivityType('activity_playdate').GetNameNoTooltip]"
 mpie_court.0100.desc_guests_none:0 "내가 [mpie_report_host.GetFirstName]에게 마련해 준 [GetActivityType('activity_playdate').GetName]의 막이 내렸지만, 다른 아이는 아무도 오지 않았다."
 mpie_court.0100.desc_guests_one:0 "내가 [mpie_report_host.GetFirstName]에게 마련해 준 [GetActivityType('activity_playdate').GetName]의 막이 내렸다. 다른 아이 한 명이 찾아왔다."
 mpie_court.0100.desc_guests_many:0 "내가 [mpie_report_host.GetFirstName]에게 마련해 준 [GetActivityType('activity_playdate').GetName]의 막이 내렸다. 다른 아이 [mpie_report_guests|0]명이 찾아왔다."
 mpie_court.0100.desc_family_sibling_and_more:0 "그중에는 [mpie_report_sibling.GetFirstName] 말고도 집안 아이가 [mpie_report_family_others|0]명 더 있었다."
 mpie_court.0100.desc_family_sibling:0 "그중에는 [mpie_report_sibling.GetFirstName]도 있었다."
 mpie_court.0100.desc_family_relative_and_more:0 "그중에는 [mpie_report_relative.GetFirstName] 말고도 집안 아이가 [mpie_report_family_others|0]명 더 있었다."
 mpie_court.0100.desc_family_relative:0 "그중에는 같은 집안인 [mpie_report_relative.GetFirstName]도 있었다."
 mpie_court.0100.desc_family_none:0 "집안 아이는 아무도 오지 않았다."
 mpie_court.0100.desc_nothing:0 ""
 mpie_court.0100.desc_friends_many:0 "\n\n[mpie_report_host.GetFirstName](은)는 [mpie_report_friend.GetFirstName](와)과 친구가 되었고, 그 밖에도 [mpie_report_friends_others|0]명과 더 친해졌다."
 mpie_court.0100.desc_friends_one:0 "\n\n[mpie_report_host.GetFirstName](은)는 [mpie_report_friend.GetFirstName](와)과 친구가 되었다."
 mpie_court.0100.desc_friends_none:0 "\n\n이번에는 [mpie_report_host.GetFirstName](이)가 새 친구를 사귀지 못했다."
 mpie_court.0100.desc_rival:0 "하지만 [mpie_report_host.GetFirstName](은)는 [mpie_report_rival.GetFirstName](와)과 사이가 틀어지고 말았다."
 mpie_court.0100.desc_rewards:0 "\n\n주최자로서 [mpie_report_host.GetFirstName](은)는 위신을 얻었고, 이제 모든 손님이 [mpie_report_host.GetHerHim]를 더 좋게 생각한다."
 mpie_court.0100.a:0 "그것참 기쁜 소식이로군."

