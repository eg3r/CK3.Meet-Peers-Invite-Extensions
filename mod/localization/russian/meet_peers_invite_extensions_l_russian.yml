 MPIE_ACTIVITY_GUEST_HOST_SIBLING_REASON:0 "[Select_CString(ROOT.Char.IsFemale, 'Она', 'Он' )] — [Select_CString(ROOT.Char.IsFemale, 'сестра', 'брат' )] хозяина: $VALUE|=+0$"
 MPIE_ACTIVITY_GUEST_HOST_FAMILY_REASON:0 "[Select_CString(ROOT.Char.IsFemale, 'Она', 'Он' )] из семьи хозяина: $VALUE|=+0$"

 # Meet Peers goals (intents)
 mpie_befriend_peer_intent:0 "Подружиться с ровесником"
 mpie_befriend_peer_intent_desc:0 "Вам хочется подружиться с выбранным ровесником, чтобы однажды сказать: «Мы — [friends|El]!» Когда вы оба прибудете, обычно выпадает минутка побыть наедине, и тогда найдётся несколько способов завоевать дружбу. Шансы выше, если вы уже нравитесь этому ровеснику."
 mpie_learn_from_peer_intent:0 "Поучиться у ровесника"
 mpie_learn_from_peer_intent_desc:0 "Вы хотите поучиться у выбранного ровесника. Когда вы оба прибудете, обычно выпадает случай взять урок: получить очко в навыке, где ровесник опережает вас сильнее всего, или в том, где отрыв второй по величине. Чем больше отрыв и чем выше ваша [learning|El], тем выше шанс."
 mpie_role_model_intent:0 "Пример для подражания"
 mpie_role_model_intent_desc:0 "Вы равняетесь на выбранного ровесника, и вам хочется, чтобы ваши [personality_traits|El] были такими же, как у него. Когда вы оба прибудете, обычно выпадает случай перенять одно из его свойств. Шансы выше, если вы друзья или близки по возрасту."

 # Befriend a Peer encounter
 mpie_peer.1001.t:0 "Зарождающаяся дружба"
 mpie_peer.1001.desc:0 "С самого моего приезда [mpie_peer.GetTitledFirstName] кажется мне [Select_CString(mpie_peer.IsFemale, 'той', 'тем' )], с кем стоит познакомиться поближе. И вот сегодня я наконец застаю [Select_CString(mpie_peer.IsFemale, 'её одну', 'его одного' )]: [mpie_peer.GetSheHe] стучит мячом о садовую стену.\n\nЕсли я хочу, чтобы мы подружились, то вот он, мой шанс!"
 mpie_peer.1001.a:0 "Позвать [mpie_peer.GetHerHis] поиграть со мной ([mpie_befriend_chance|0]%)"
 mpie_peer.1001.b:0 "Принести [mpie_peer.GetHerHim] сладостей в подарок ([mpie_befriend_invest_chance|0]%)"
 mpie_peer.1001.f.prestige:0 "Пригласить [mpie_peer.GetHerHis] сесть рядом со мной за главным столом ([mpie_befriend_invest_chance|0]%)"
 mpie_peer.1001.f.influence:0 "Пообещать замолвить словечко за [mpie_peer.GetHerHis] семью при дворе ([mpie_befriend_invest_chance|0]%)"
 mpie_peer.1001.c:0 "Рассмешить [mpie_peer.GetHerHis] до слёз ([mpie_befriend_trait_chance|0]%)"
 mpie_peer.1001.d:0 "Бежим наперегонки до старого дуба! ([mpie_befriend_trait_chance|0]%)"
 mpie_peer.1001.e:0 "Расспросить [mpie_peer.GetHerHis] о [mpie_peer.GetHerHis] родном доме ([mpie_befriend_trait_chance|0]%)"
 mpie_befriend_success_tt:0 "Друзья!"
 mpie_befriend_failure_tt:0 "Пока не друзья"

 # Learn from a Peer encounter
 mpie_peer.2001.t:0 "Урок от ровесника"
 mpie_peer.2001.desc.diplomacy:0 "[mpie_peer.GetTitledFirstName] всегда знает, что сказать. Когда [mpie_peer.GetSheHe] говорит, другие дети слушают, и даже взрослые [mpie_peer.GetHerHim] улыбаются.\n\nЕсли [mpie_peer.GetSheHe] покажет мне, как это делается, мой навык «[diplomacy|E]» станет куда лучше."
 mpie_peer.2001.desc.martial:0 "Когда мы играем в войну, приказы всегда отдаёт [mpie_peer.GetTitledFirstName], и [mpie_peer.GetHerHis] сторона неизменно побеждает.\n\nЕсли [mpie_peer.GetSheHe] покажет мне, как это делается, мой навык «[martial|E]» станет куда лучше."
 mpie_peer.2001.desc.stewardship:0 "[mpie_peer.GetTitledFirstName] ведёт счёт каждому камешку, каждой конфете и каждой медной монетке, которыми мы меняемся, и почему-то в итоге у н[mpie_peer.GetHerHis] всегда больше, чем было вначале.\n\nЕсли [mpie_peer.GetSheHe] покажет мне, как это делается, мой навык «[stewardship|E]» станет куда лучше."
 mpie_peer.2001.desc.intrigue:0 "Что бы здесь ни случилось, [mpie_peer.GetTitledFirstName] узнаёт об этом раньше всех. [mpie_peer.GetSheHe|U] слышит каждый шёпот и находит любое укромное местечко.\n\nЕсли [mpie_peer.GetSheHe] покажет мне, как это делается, мой навык «[intrigue|E]» станет куда лучше."
 mpie_peer.2001.desc.learning:0 "[mpie_peer.GetTitledFirstName] [Select_CString(mpie_peer.IsFemale, 'прочла', 'прочёл' )] больше книг, чем кто-либо из моих знакомых, и может ответить на вопросы, перед которыми пасуют даже наши учителя.\n\nЕсли [mpie_peer.GetSheHe] покажет мне, как это делается, мой навык «[learning|E]» станет куда лучше."
 mpie_peer.2001.desc.prowess:0 "[mpie_peer.GetTitledFirstName] ловко двигается, крепко бьёт и никогда не роняет свой деревянный меч, каким бы сильным ни был удар.\n\nЕсли [mpie_peer.GetSheHe] покажет мне, как это делается, мой навык «[prowess|E]» станет куда лучше."
 mpie_peer.2001.desc.gap:0 "\n\n#weak [mpie_peer.GetSheHe|U] опережает меня на [mpie_learn_gap|0].#!"
 mpie_peer.2001.a.diplomacy:0 "Попросить [mpie_peer.GetHerHis] подтянуть мой навык «[diplomacy|E]» ([mpie_learn_chance|0]%)"
 mpie_peer.2001.a.martial:0 "Попросить [mpie_peer.GetHerHis] подтянуть мой навык «[martial|E]» ([mpie_learn_chance|0]%)"
 mpie_peer.2001.a.stewardship:0 "Попросить [mpie_peer.GetHerHis] подтянуть мой навык «[stewardship|E]» ([mpie_learn_chance|0]%)"
 mpie_peer.2001.a.intrigue:0 "Попросить [mpie_peer.GetHerHis] подтянуть мой навык «[intrigue|E]» ([mpie_learn_chance|0]%)"
 mpie_peer.2001.a.learning:0 "Попросить [mpie_peer.GetHerHis] подтянуть мой навык «[learning|E]» ([mpie_learn_chance|0]%)"
 mpie_peer.2001.a.prowess:0 "Попросить [mpie_peer.GetHerHis] подтянуть мой навык «[prowess|E]» ([mpie_learn_chance|0]%)"
 mpie_peer.2001.b.diplomacy:0 "Лучше спросить про навык «[diplomacy|E]» ([mpie_learn_chance_2|0]%)"
 mpie_peer.2001.b.martial:0 "Лучше спросить про навык «[martial|E]» ([mpie_learn_chance_2|0]%)"
 mpie_peer.2001.b.stewardship:0 "Лучше спросить про навык «[stewardship|E]» ([mpie_learn_chance_2|0]%)"
 mpie_peer.2001.b.intrigue:0 "Лучше спросить про навык «[intrigue|E]» ([mpie_learn_chance_2|0]%)"
 mpie_peer.2001.b.learning:0 "Лучше спросить про навык «[learning|E]» ([mpie_learn_chance_2|0]%)"
 mpie_peer.2001.b.prowess:0 "Лучше спросить про навык «[prowess|E]» ([mpie_learn_chance_2|0]%)"
 mpie_peer.2001.c:0 "Сначала вместе помолиться о мудрости ([mpie_learn_invest_chance|0]%)"
 mpie_peer.2001.d.prestige:0 "Напомнить [mpie_peer.GetHerHim], кто я, — уж мне-то [mpie_peer.GetSheHe] не откажет ([mpie_learn_invest_chance|0]%)"
 mpie_peer.2001.d.influence:0 "Пообещать [mpie_peer.GetHerHis] семье взамен свою благосклонность при дворе ([mpie_learn_invest_chance|0]%)"
 mpie_learn_success_tt:0 "Урок усвоен"
 mpie_learn_failure_tt:0 "Урок не впрок"
 mpie_learn_failure_effect_tt:0 "[mpie_peer.GetShortUIName] [Select_CString(mpie_peer.IsFemale, 'пыталась', 'пытался' )] вас научить, но ничего не запомнилось"

 # Role Model encounter
 mpie_peer.3001.t:0 "Есть на кого равняться"
 mpie_peer.3001.desc:0 "Не могу перестать смотреть, как держится [mpie_peer.GetTitledFirstName]. Все вокруг говорят, что «[mpie_modeled_trait.GetName( mpie_peer )]» — это прямо про н[mpie_peer.GetHerHis], и, кажется, все [mpie_peer.GetHerHis] за это ценят.\n\nМожет, и мне стать [Select_CString(ROOT.Char.IsFemale, 'такой', 'таким' )] же?"
 mpie_peer.3001.desc.second:0 "Впрочем, «[mpie_modeled_trait_2.GetName( mpie_peer )]» — это тоже про н[mpie_peer.GetHerHis]..."
 mpie_peer.3001.a:0 "Хочу, чтобы и у меня была такая черта — «[mpie_modeled_trait.GetName( ROOT.Char )]»! ([mpie_role_model_chance|0]%)"
 mpie_peer.3001.b:0 "А может, лучше перенять черту «[mpie_modeled_trait_2.GetName( ROOT.Char )]»? ([mpie_role_model_chance_2|0]%)"
 mpie_peer.3001.c:0 "Попросить капеллана помочь мне перенять черту «[mpie_modeled_trait.GetName( ROOT.Char )]» ([mpie_role_model_invest_chance|0]%)"
 mpie_role_model_success_tt:0 "По примеру ровесника"
 mpie_role_model_failure_tt:0 "Остаться собой"
 mpie_role_model_failure_effect_tt:0 "Вы пытались брать пример с персонажа [mpie_peer.GetShortUIName], но это оказалось не для вас"
 mpie_role_model_adopted_effect_tt:0 "[trait|E] «[mpie_adopted_trait.GetName( mpie_actor )]» перенято у персонажа [mpie_peer.GetShortUIName]"
 mpie_role_model_rejected_tt:0 "Не судьба"
