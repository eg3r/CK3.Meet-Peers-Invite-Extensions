 mpie_reset_meet_peers_cooldown_decision_tooltip:0 "Запланировать новое событие [GetActivityType('activity_playdate').GetName], не дожидаясь окончания перезарядки"
 mpie_reset_meet_peers_cooldown_decision_desc:0 "#F Зачем ждать годами, чтобы снова увидеть сверстников? Я приглашу их снова прямо сейчас!#!"
 mpie_reset_meet_peers_cooldown_decision_confirm:0 "Пригласим их снова!"
 mpie_reset_meet_peers_cooldown_decision_effect_tt:0 "Следующее событие [GetActivityType('activity_playdate').GetName] можно запланировать сразу. Его планирование запустит новую перезарядку."
 
 # Game rule: cooldown reset
