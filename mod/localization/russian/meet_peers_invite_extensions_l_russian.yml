 MPIE_COURT_MEET_PEERS_ON_COOLDOWN_THIRD:0 "Двор персонажа [CHARACTER.GetShortUIName] не может провести следующее событие [GetActivityType('activity_playdate').GetName] для ребёнка до [GetCurrentDateWithDiff( GetVarTimeRemaining( CHARACTER.MakeScope, 'mpie_court_meet_peers_cooldown') )]"
