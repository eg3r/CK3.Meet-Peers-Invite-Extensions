 setting_mpie_meet_peers_cooldown_reset_disabled:0 "Выключено"
 setting_mpie_meet_peers_cooldown_reset_disabled_desc:0 "Решение о сбросе перезарядки «Встречи с ровесниками» недоступно."
 setting_mpie_meet_peers_cooldown_reset_enabled:0 "Включено"
 setting_mpie_meet_peers_cooldown_reset_enabled_desc:0 "Игроки могут принять решение о сбросе перезарядки «Встречи с ровесниками», чтобы запланировать следующую без ожидания."
 
 # Game rule: cooldown length
 rule_mpie_meet_peers_cooldown:0 "Перезарядка «Встречи с ровесниками»"
 setting_mpie_meet_peers_cooldown_1_year:0 "1 год"
 setting_mpie_meet_peers_cooldown_1_year_desc:0 "После проведения «Встречи с ровесниками» персонаж должен подождать 1 год, прежде чем провести следующую."
 setting_mpie_meet_peers_cooldown_2_years:0 "2 года"
 setting_mpie_meet_peers_cooldown_2_years_desc:0 "После проведения «Встречи с ровесниками» персонаж должен подождать 2 года, прежде чем провести следующую."
 setting_mpie_meet_peers_cooldown_3_years:0 "3 года (базовая игра)"
 setting_mpie_meet_peers_cooldown_3_years_desc:0 "После проведения «Встречи с ровесниками» персонаж должен подождать 3 года, прежде чем провести следующую, как в базовой игре."

 # Game rule: AI Meet Peers and player children
 rule_mpie_ai_invites_players:0 "«Встречи с ровесниками» ИИ и дети-игроки"
 setting_mpie_ai_invites_players_off:0 "Выключено"
 setting_mpie_ai_invites_players_off_desc:0 "Дети ИИ проводят «Встречи с ровесниками» как в базовой игре и не ищут детей-игроков поблизости."
 setting_mpie_ai_invites_players_near:0 "Поблизости"
 setting_mpie_ai_invites_players_near_desc:0 "Дети ИИ чаще проводят «Встречи с ровесниками» (графы — примерно раз за детство, императоры — до четырёх раз), приглашают детей-игроков из того же или соседнего государства или живущих неподалёку и охотнее проводят встречи, если такой ребёнок рядом."
 setting_mpie_ai_invites_players_near_and_faith:0 "Поблизости и та же вера"
 setting_mpie_ai_invites_players_near_and_faith_desc:0 "Как «Поблизости», а также дети ИИ приглашают детей-игроков своей веры издалека."

 # Game rule: Meet Peers guests at war
 rule_mpie_meet_peers_guests_at_war:0 "Гости «Встречи с ровесниками» во время войны"
 setting_mpie_meet_peers_guests_at_war_disabled:0 "Запрещено"
 setting_mpie_meet_peers_guests_at_war_disabled_desc:0 "Как в базовой игре, дети, ведущие войну, не могут посещать «Встречу с ровесниками»."
 setting_mpie_meet_peers_guests_at_war_enabled:0 "Разрешено игрокам"
 setting_mpie_meet_peers_guests_at_war_enabled_desc:0 "Дети-игроки, ведущие войну, всё равно могут посещать «Встречи с ровесниками» как гости. Дети ИИ без изменений."
 
 # Cooldown tooltip (common/trigger_localization/mpie_trigger_localization.txt)
 MPIE_MEET_PEERS_ON_COOLDOWN_FIRST:0 "Вы не можете провести следующее событие [GetActivityType('activity_playdate').GetName] до [GetCurrentDateWithDiff( GetVarTimeRemaining( CHARACTER.MakeScope, 'mpie_meet_peers_cooldown') )]"
 MPIE_MEET_PEERS_ON_COOLDOWN_THIRD:0 "[CHARACTER.GetShortUIName|U] не может провести следующее событие [GetActivityType('activity_playdate').GetName] до [GetCurrentDateWithDiff( GetVarTimeRemaining( CHARACTER.MakeScope, 'mpie_meet_peers_cooldown') )]"

 # Game rule: court children host Meet Peers
 game_rule_category_mpie_meet_peers:0 "Встреча с ровесниками"
 rule_mpie_court_children_meet_peers:0 "«Встречи с ровесниками» детей при дворе"
 setting_mpie_court_children_meet_peers_off:0 "Выключено"
 setting_mpie_court_children_meet_peers_off_desc:0 "Как в базовой игре, «Встречу с ровесниками» могут проводить только дети с титулом."
 setting_mpie_court_children_meet_peers_kingdom:0 "Короли и выше"
 setting_mpie_court_children_meet_peers_kingdom_desc:0 "Короли и императоры могут запланировать «Встречу с ровесниками» для ребёнка без титула при своём дворе, и ребёнок её проведёт. Раз в год ребёнок может и сам попросить: правители ИИ соглашаются, если могут себе это позволить, игроки могут отказать. Каждый двор проводит не больше одной встречи раз в 2 года."
 setting_mpie_court_children_meet_peers_duchy:0 "Герцоги и выше"
 setting_mpie_court_children_meet_peers_duchy_desc:0 "Как «Короли и выше», а также дети герцогов."
 mpie_meet_peers_refused_opinion:0 "Отказ во «Встрече с ровесниками»"

