 # Relationship reason
 mpie_friend_meet_peers_reason:0 "[CHARACTER.GetShortUIName|U] и [TARGET_CHARACTER.GetShortUIName] подружились благодаря событию [GetActivityType('activity_playdate').GetNameNoTooltip]."

 # Court children host Meet Peers (mpie_court_triggers.txt, events/activities/mpie_court_meet_peers_events.txt)
 mpie_court.0001.t:0 "Просьба при дворе"
 mpie_court.0001.desc:0 "Всё утро [mpie_court_child.GetFirstName] ходит за мной хвостиком по залу. Наконец [mpie_court_child.GetSheHe] дёргает меня за рукав.\n\n«Пожалуйста, пусть у нас будет [GetActivityType('activity_playdate').GetName|l], а [Select_CString(mpie_court_child.IsFemale, 'хозяйкой', 'хозяином' )] буду я! Я хочу пригласить других детей со всей державы и даже из-за её пределов!»\n\n[GetActivityType('activity_playdate').GetNameNoTooltip] при моём дворе обойдётся примерно в [mpie_court_meet_peers_cost|0][gold_i]."
 mpie_court.0001.a:0 "Конечно, дитя моё. Я всё устрою!"
 mpie_court.0001.b:0 "Не в этом году, [mpie_court_child.GetFirstName]."
 mpie_court_meet_peers_accept_tt:0 "Откроется окно планирования события [GetActivityType('activity_playdate').GetName], где [mpie_court_child.GetFirstName] будет в роли [Select_CString(mpie_court_child.IsFemale, 'юной хозяйки', 'юного хозяина' )]. Его можно запланировать и позже, в течение следующего года: туда приведёт напоминание вверху экрана"
 mpie_court_meet_peers_declined_tt:0 "[mpie_court_child.GetFirstName] не будет просить об этом ещё год"
 mpie_court_meet_peers_started_title:0 "[GetActivityType('activity_playdate').GetNameNoTooltip]: гостей принимает [mpie_court_child.GetFirstName]"
 mpie_court_meet_peers_started_desc:0 "[mpie_court_child.GetFirstName] [Select_CString(mpie_court_child.IsFemale, 'стала хозяйкой', 'стал хозяином' )] запланированного вами события [GetActivityType('activity_playdate').GetName]"

 # End report for a player ruler (mpie_court.0100)
 mpie_court.0100.t:0 "[GetActivityType('activity_playdate').GetNameNoTooltip]: гостей [Select_CString(mpie_report_host.IsFemale, 'принимала', 'принимал' )] [mpie_report_host.GetFirstName]"
 mpie_court.0100.desc_guests_none:0 "Устроенная мною [GetActivityType('activity_playdate').GetName|l] окончена. [mpie_report_host.GetFirstName] [Select_CString(mpie_report_host.IsFemale, 'ждала', 'ждал' )] гостей, но другие дети так и не приехали."
 mpie_court.0100.desc_guests_one:0 "Устроенная мною [GetActivityType('activity_playdate').GetName|l] окончена. [mpie_report_host.GetFirstName] [Select_CString(mpie_report_host.IsFemale, 'принимала', 'принимал' )] одного гостя."
 mpie_court.0100.desc_guests_many:0 "Устроенная мною [GetActivityType('activity_playdate').GetName|l] окончена. [mpie_report_host.GetFirstName] [Select_CString(mpie_report_host.IsFemale, 'принимала', 'принимал' )] гостей — других детей приехало [mpie_report_guests|0]."
 mpie_court.0100.desc_family_sibling_and_more:0 "Среди гостей были [mpie_report_sibling.GetFirstName] и ещё [mpie_report_family_others|0] из нашей семьи."
 mpie_court.0100.desc_family_sibling:0 "Среди гостей [Select_CString(mpie_report_sibling.IsFemale, 'была', 'был' )] и [mpie_report_sibling.GetFirstName]."
 mpie_court.0100.desc_family_relative_and_more:0 "Среди гостей были [mpie_report_relative.GetFirstName] и ещё [mpie_report_family_others|0] из нашей семьи."
 mpie_court.0100.desc_family_relative:0 "Среди гостей [Select_CString(mpie_report_relative.IsFemale, 'была', 'был' )] и [mpie_report_relative.GetFirstName] — тоже из нашей семьи."
 mpie_court.0100.desc_family_none:0 "Из нашей семьи никто не приехал."
 mpie_court.0100.desc_nothing:0 ""
 mpie_court.0100.desc_friends_many:0 "\n\n[mpie_report_host.GetFirstName] [Select_CString(mpie_report_host.IsFemale, 'нашла', 'нашёл' )] новых друзей: [mpie_report_friend.GetFirstName] и ещё [mpie_report_friends_others|0] из гостей."
 mpie_court.0100.desc_friends_one:0 "\n\n[mpie_report_host.GetFirstName] и [mpie_report_friend.GetFirstName] подружились."
 mpie_court.0100.desc_friends_none:0 "\n\nНа этот раз [mpie_report_host.GetFirstName] не [Select_CString(mpie_report_host.IsFemale, 'нашла', 'нашёл' )] новых друзей."
 mpie_court.0100.desc_rival:0 "Правда, [mpie_report_host.GetFirstName] и [mpie_report_rival.GetFirstName] успели рассориться."
 mpie_court.0100.desc_rewards:0 "\n\nБудучи [Select_CString(mpie_report_host.IsFemale, 'хозяйкой', 'хозяином' )] встречи, [mpie_report_host.GetFirstName] [Select_CString(mpie_report_host.IsFemale, 'получила', 'получил' )] престиж, а все гости теперь относятся к н[mpie_report_host.GetHerHim] лучше."
 mpie_court.0100.a:0 "Приятно это слышать."

