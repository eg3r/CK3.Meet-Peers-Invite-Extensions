 # Court children host Meet Peers (mpie_court_triggers.txt, events/activities/mpie_court_meet_peers_events.txt)
 mpie_court.0001.t:0 "宫廷中的请求"
 mpie_court.0001.desc:0 "整个上午，[mpie_court_child.GetFirstName]都跟着我在大厅里转来转去。终于，[mpie_court_child.GetSheHe]拉了拉我的袖子。\n\n“求求您，我可以举办一场[GetActivityType('activity_playdate').GetName]吗？我想把其他孩子都请来，不管是国内各地的，还是更远地方的！”\n\n在我的宫廷举办一场[GetActivityType('activity_playdate').GetNameNoTooltip]大约需要花费[mpie_court_meet_peers_cost|0][gold_i]。"
 mpie_court.0001.a:0 "当然可以，小家伙。我来安排！"
 mpie_court.0001.b:0 "今年不行，[mpie_court_child.GetFirstName]。"
 mpie_court_meet_peers_accept_tt:0 "[GetActivityType('activity_playdate').GetName]筹划界面将会打开，由[mpie_court_child.GetFirstName]担任小主人。你也可以在接下来的一年内再筹划：屏幕顶部的提醒会带你前往"
 mpie_court_meet_peers_declined_tt:0 "[mpie_court_child.GetFirstName]在一年内不会再提出请求"
 mpie_court_meet_peers_started_title:0 "[mpie_court_child.GetFirstName]举办[GetActivityType('activity_playdate').GetNameNoTooltip]"
 mpie_court_meet_peers_started_desc:0 "[mpie_court_child.GetFirstName]已接手你筹划的[GetActivityType('activity_playdate').GetName]，担任主人"

