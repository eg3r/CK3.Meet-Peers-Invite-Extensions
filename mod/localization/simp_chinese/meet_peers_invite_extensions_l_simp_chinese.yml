 setting_mpie_meet_peers_guests_at_war_disabled_desc:0 "与原版游戏相同，交战中的孩子不能参加会见同辈。"
 setting_mpie_meet_peers_guests_at_war_enabled:0 "允许玩家"
 setting_mpie_meet_peers_guests_at_war_enabled_desc:0 "交战中的玩家孩子仍可作为宾客参加会见同辈。AI孩子不变。"
 
