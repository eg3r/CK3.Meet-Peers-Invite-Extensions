 MPIE_ACTIVITY_GUEST_HOST_FAMILY_REASON:0 "[ROOT.Char.GetSheHe|U]是主人的家人：$VALUE|=+0$"

 # Meet Peers goals (intents)
 mpie_befriend_peer_intent:0 "结交同辈"
 mpie_befriend_peer_intent_desc:0 "你想与你的目标成为[friends|E]。你们都到场后，通常会有与对方独处的时刻，并有几种方式可以赢得对方的友谊。如果对方本来就喜欢你，成功的可能性会更大。"
 mpie_learn_from_peer_intent:0 "向同辈学习"
 mpie_learn_from_peer_intent_desc:0 "你想向你的目标学习。你们都到场后，通常会有一次请教的机会：在对方领先你最多的技能上提升1点，或改学对方领先第二多的技能。差距越大、你的[learning|E]越高，成功几率就越大。"
 mpie_role_model_intent:0 "榜样"
 mpie_role_model_intent_desc:0 "你很仰慕你的目标。你们都到场后，通常会有一次机会让你习得对方的一项[personality_traits|E]。如果你们是朋友或年龄相近，可能性会更大。"

 # Befriend a Peer encounter
 mpie_peer.1001.t:0 "友谊萌芽"
 mpie_peer.1001.desc:0 "自从来到这里，我就一直想多了解一下[mpie_peer.GetTitledFirstName]。今天我终于碰到[mpie_peer.GetSheHe]独自一人，正对着花园的墙壁扔球玩。\n\n如果我想和[mpie_peer.GetHerHim]成为朋友，现在就是我的机会！"
 mpie_peer.1001.a:0 "邀请[mpie_peer.GetHerHim]和我一起玩（[mpie_befriend_chance|0]%）"
 mpie_peer.1001.b:0 "给[mpie_peer.GetHerHim]带些糖果当作礼物（[mpie_befriend_invest_chance|0]%）"
 mpie_peer.1001.f.prestige:0 "邀请[mpie_peer.GetHerHim]在主桌上坐在我身旁（[mpie_befriend_invest_chance|0]%）"
 mpie_peer.1001.f.influence:0 "答应在宫廷中为[mpie_peer.GetHerHis]的家族说话（[mpie_befriend_invest_chance|0]%）"
 mpie_peer.1001.c:0 "把[mpie_peer.GetHerHim]逗得笑出眼泪（[mpie_befriend_trait_chance|0]%）"
 mpie_peer.1001.d:0 "和[mpie_peer.GetHerHim]比赛，看谁先跑到老橡树下！（[mpie_befriend_trait_chance|0]%）"
 mpie_peer.1001.e:0 "向[mpie_peer.GetHerHim]打听[mpie_peer.GetHerHis]家乡的一切（[mpie_befriend_trait_chance|0]%）"
 mpie_befriend_success_tt:0 "成为朋友！"
 mpie_befriend_failure_tt:0 "还不是朋友"

 # Learn from a Peer encounter
 mpie_peer.2001.t:0 "同辈的指点"
 mpie_peer.2001.desc.diplomacy:0 "[mpie_peer.GetTitledFirstName]似乎总是知道该说什么。[mpie_peer.GetSheHe|U]说话时，其他孩子都会认真倾听，就连大人们也会对[mpie_peer.GetHerHim]微笑。\n\n要是[mpie_peer.GetSheHe]肯教我，我的[diplomacy|E]一定能大有长进。"
 mpie_peer.2001.desc.martial:0 "每次我们玩打仗游戏，发号施令的总是[mpie_peer.GetTitledFirstName]，而且[mpie_peer.GetHerHis]那一方总能获胜。\n\n要是[mpie_peer.GetSheHe]肯教我，我的[martial|E]一定能大有长进。"
 mpie_peer.2001.desc.stewardship:0 "我们交换的每一颗弹珠、每一块糖果和每一枚铜币，[mpie_peer.GetTitledFirstName]都记得清清楚楚，而且不知怎么的，[mpie_peer.GetSheHe]最后手里的东西总比一开始多。\n\n要是[mpie_peer.GetSheHe]肯教我，我的[stewardship|E]一定能大有长进。"
 mpie_peer.2001.desc.intrigue:0 "这里发生的任何事，[mpie_peer.GetTitledFirstName]总是第一个知道。每一句悄悄话[mpie_peer.GetSheHe|U]都听得到，每一个藏身之处[mpie_peer.GetSheHe]都找得到。\n\n要是[mpie_peer.GetSheHe]肯教我，我的[intrigue|E]一定能大有长进。"
 mpie_peer.2001.desc.learning:0 "[mpie_peer.GetTitledFirstName]读过的书比我认识的任何人都多，就连我们的老师都答不上来的问题，[mpie_peer.GetSheHe]也能回答。\n\n要是[mpie_peer.GetSheHe]肯教我，我的[learning|E]一定能大有长进。"
 mpie_peer.2001.desc.prowess:0 "[mpie_peer.GetTitledFirstName]又敏捷又强壮，无论挨了多重的一击，[mpie_peer.GetHerHis]的木剑都从不脱手。\n\n要是[mpie_peer.GetSheHe]肯教我，我的[prowess|E]一定能大有长进。"
 mpie_peer.2001.desc.gap:0 "\n\n#weak [mpie_peer.GetSheHe|U]比我高出[mpie_learn_gap|0]点。#!"
 mpie_peer.2001.a.diplomacy:0 "请[mpie_peer.GetHerHim]教我[diplomacy|E]（[mpie_learn_chance|0]%）"
 mpie_peer.2001.a.martial:0 "请[mpie_peer.GetHerHim]教我[martial|E]（[mpie_learn_chance|0]%）"
 mpie_peer.2001.a.stewardship:0 "请[mpie_peer.GetHerHim]教我[stewardship|E]（[mpie_learn_chance|0]%）"
 mpie_peer.2001.a.intrigue:0 "请[mpie_peer.GetHerHim]教我[intrigue|E]（[mpie_learn_chance|0]%）"
 mpie_peer.2001.a.learning:0 "请[mpie_peer.GetHerHim]教我[learning|E]（[mpie_learn_chance|0]%）"
 mpie_peer.2001.a.prowess:0 "请[mpie_peer.GetHerHim]教我[prowess|E]（[mpie_learn_chance|0]%）"
 mpie_peer.2001.b.diplomacy:0 "改为请教[diplomacy|E]（[mpie_learn_chance_2|0]%）"
 mpie_peer.2001.b.martial:0 "改为请教[martial|E]（[mpie_learn_chance_2|0]%）"
 mpie_peer.2001.b.stewardship:0 "改为请教[stewardship|E]（[mpie_learn_chance_2|0]%）"
 mpie_peer.2001.b.intrigue:0 "改为请教[intrigue|E]（[mpie_learn_chance_2|0]%）"
 mpie_peer.2001.b.learning:0 "改为请教[learning|E]（[mpie_learn_chance_2|0]%）"
 mpie_peer.2001.b.prowess:0 "改为请教[prowess|E]（[mpie_learn_chance_2|0]%）"
 mpie_peer.2001.c:0 "先一起祈求智慧（[mpie_learn_invest_chance|0]%）"
 mpie_peer.2001.d.prestige:0 "提醒[mpie_peer.GetHerHim]我是谁，[mpie_peer.GetSheHe]不会拒绝我的（[mpie_learn_invest_chance|0]%）"
 mpie_peer.2001.d.influence:0 "作为回报，答应在宫廷中关照[mpie_peer.GetHerHis]的家族（[mpie_learn_invest_chance|0]%）"
 mpie_learn_success_tt:0 "学有所获"
 mpie_learn_failure_tt:0 "一无所获"
 mpie_learn_failure_effect_tt:0 "[mpie_peer.GetShortUIName]试着教你，但你没能学会"

 # Role Model encounter
 mpie_peer.3001.t:0 "心中的榜样"
 mpie_peer.3001.desc:0 "我的目光总是离不开[mpie_peer.GetTitledFirstName]。大家都注意到[mpie_peer.GetSheHe]有多么[mpie_modeled_trait.GetName( mpie_peer )|l]，似乎也都因此而钦佩[mpie_peer.GetHerHim]。\n\n也许我也可以变得像[mpie_peer.GetHerHim]那样？"
 mpie_peer.3001.desc.second:0 "不过话说回来，[mpie_peer.GetSheHe]有时也是那么[mpie_modeled_trait_2.GetName( mpie_peer )|l]……"
 mpie_peer.3001.a:0 "我也要变得[mpie_modeled_trait.GetName( ROOT.Char )|l]！（[mpie_role_model_chance|0]%）"
 mpie_peer.3001.b:0 "也许我应该变得[mpie_modeled_trait_2.GetName( ROOT.Char )|l]才对（[mpie_role_model_chance_2|0]%）"
 mpie_peer.3001.c:0 "请宫廷司祭帮助我变得[mpie_modeled_trait.GetName( ROOT.Char )|l]（[mpie_role_model_invest_chance|0]%）"
 mpie_role_model_success_tt:0 "以同辈为榜样"
 mpie_role_model_failure_tt:0 "还是原来的我"
 mpie_role_model_failure_effect_tt:0 "你试着变得更像[mpie_peer.GetShortUIName]，但这并不适合你"
 mpie_role_model_adopted_effect_tt:0 "从[mpie_peer.GetShortUIName]身上习得了[mpie_adopted_trait.GetName( mpie_actor )][trait|E]"
