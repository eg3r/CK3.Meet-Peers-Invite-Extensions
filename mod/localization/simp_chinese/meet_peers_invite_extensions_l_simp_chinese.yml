 # Game rule: court children host Meet Peers
 game_rule_category_mpie_meet_peers:0 "会见同辈"
 rule_mpie_court_children_meet_peers:0 "宫廷孩子举办会见同辈"
 setting_mpie_court_children_meet_peers_off:0 "关闭"
 setting_mpie_court_children_meet_peers_off_desc:0 "与原版游戏相同，只有持有头衔的孩子才能举办会见同辈。"
 setting_mpie_court_children_meet_peers_kingdom:0 "国王及以上"
 setting_mpie_court_children_meet_peers_kingdom_desc:0 "国王和皇帝可以为宫廷中没有头衔的孩子筹划会见同辈，由孩子担任主人。孩子每年也可能主动请求：AI统治者负担得起就会同意，玩家可以拒绝。每个宫廷每2年最多举办一次。"
 setting_mpie_court_children_meet_peers_duchy:0 "公爵及以上"
 setting_mpie_court_children_meet_peers_duchy_desc:0 "与“国王及以上”相同，公爵的孩子也包括在内。"
