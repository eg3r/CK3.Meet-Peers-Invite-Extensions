 # Game rule: cooldown length
 rule_mpie_meet_peers_cooldown:0 "会见同辈冷却时间"
 setting_mpie_meet_peers_cooldown_1_year:0 "1年"
 setting_mpie_meet_peers_cooldown_1_year_desc:0 "举办会见同辈后，角色需要等待1年才能举办下一次。"
 setting_mpie_meet_peers_cooldown_2_years:0 "2年"
 setting_mpie_meet_peers_cooldown_2_years_desc:0 "举办会见同辈后，角色需要等待2年才能举办下一次。"
 setting_mpie_meet_peers_cooldown_3_years:0 "3年（原版）"
 setting_mpie_meet_peers_cooldown_3_years_desc:0 "举办会见同辈后，角色需要等待3年才能举办下一次，与原版游戏相同。"

 # Game rule: AI Meet Peers and player children
 rule_mpie_ai_invites_players:0 "AI会见同辈与玩家孩子"
 setting_mpie_ai_invites_players_off:0 "关闭"
 setting_mpie_ai_invites_players_off_desc:0 "AI孩子与原版游戏一样举办会见同辈，不会寻找附近的玩家孩子。"
 setting_mpie_ai_invites_players_near:0 "附近"
 setting_mpie_ai_invites_players_near_desc:0 "AI孩子会更常举办会见同辈（伯爵在童年约一次，皇帝最多四次），邀请来自同一或相邻国家、或住在附近的玩家孩子，并在有玩家孩子在附近时更积极地举办。"
 setting_mpie_ai_invites_players_near_and_faith:0 "附近及同一信仰"
 setting_mpie_ai_invites_players_near_and_faith_desc:0 "与“附近”相同，且AI孩子还会邀请住得更远的同一信仰的玩家孩子。"

 # Game rule: Meet Peers guests at war
 rule_mpie_meet_peers_guests_at_war:0 "交战中的会见同辈宾客"
