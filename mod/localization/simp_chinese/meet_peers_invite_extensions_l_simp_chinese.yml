 mpie_court.0100.t:0 "[mpie_report_host.GetFirstName]的[GetActivityType('activity_playdate').GetNameNoTooltip]"
 mpie_court.0100.desc_guests_none:0 "我为[mpie_report_host.GetFirstName]筹划的[GetActivityType('activity_playdate').GetName]已经结束了，但没有其他孩子前来。"
 mpie_court.0100.desc_guests_one:0 "我为[mpie_report_host.GetFirstName]筹划的[GetActivityType('activity_playdate').GetName]已经结束了。另有一个孩子前来参加。"
 mpie_court.0100.desc_guests_many:0 "我为[mpie_report_host.GetFirstName]筹划的[GetActivityType('activity_playdate').GetName]已经结束了。另有[mpie_report_guests|0]个孩子前来参加。"
