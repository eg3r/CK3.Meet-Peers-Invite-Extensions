 # Activity log
 mpie_peer_goal_missed_log_title:0 "Ocasión perdida"
 mpie_peer_goal_missed_log:0 "[CHARACTER.Custom('ES_ElLa')|U] [CHARACTER.GetTitledFirstName|l] nunca tuvo ocasión de pasar tiempo con [TARGET_CHARACTER.Custom('ES_ElLa')] [TARGET_CHARACTER.GetTitledFirstName|l]"
 mpie_peer_goal_no_moment_log_title:0 "Sin un momento juntos"
 mpie_peer_goal_no_moment_log:0 "[CHARACTER.Custom('ES_ElLa')|U] [CHARACTER.GetTitledFirstName|l] nunca encontró el momento oportuno para estar con [TARGET_CHARACTER.Custom('ES_ElLa')] [TARGET_CHARACTER.GetTitledFirstName|l]"
 mpie_peer_befriend_failed_log_title:0 "Aún no son amigos"
 mpie_peer_befriend_failed_log:0 "[CHARACTER.Custom('ES_ElLa')|U] [CHARACTER.GetTitledFirstName|l] intentó ganarse la amistad [TARGET_CHARACTER.Custom('ES_DelDela')] [TARGET_CHARACTER.GetTitledFirstName|l], sin éxito"
 mpie_peer_learned_log_title:0 "Lección aprendida"
 mpie_peer_learned_log:0 "[CHARACTER.Custom('ES_ElLa')|U] [CHARACTER.GetTitledFirstName|l] aprendió un par de cosas [TARGET_CHARACTER.Custom('ES_DelDela')] [TARGET_CHARACTER.GetTitledFirstName|l]"
 mpie_peer_learn_failed_log_title:0 "Lección en vano"
 mpie_peer_learn_failed_log:0 "[CHARACTER.Custom('ES_ElLa')|U] [CHARACTER.GetTitledFirstName|l] intentó aprender [TARGET_CHARACTER.Custom('ES_DelDela')] [TARGET_CHARACTER.GetTitledFirstName|l], pero no pudo seguirle el ritmo"
 mpie_peer_role_model_log_title:0 "Siguiendo su ejemplo"
