 mpie_peer_role_model_failed_log_title:0 "Fiel a su manera de ser"
 mpie_peer_role_model_failed_log:0 "[CHARACTER.Custom('ES_ElLa')|U] [CHARACTER.GetTitledFirstName|l] intentó parecerse más [TARGET_CHARACTER.Custom('ES_AlAla')] [TARGET_CHARACTER.GetTitledFirstName|l], pero no iba con su manera de ser"

 # Relationship reason
 mpie_friend_meet_peers_reason:0 "La amistad entre [CHARACTER.GetShortUIName] y [TARGET_CHARACTER.GetShortUIName] nació en un [GetActivityType('activity_playdate').GetNameNoTooltip]."

 # Court children host Meet Peers (mpie_court_triggers.txt, events/activities/mpie_court_meet_peers_events.txt)
 mpie_court.0001.t:0 "Una petición en la corte"
 mpie_court.0001.desc:0 "Durante toda la mañana, [mpie_court_child.GetFirstName] me ha seguido por el salón. Por fin, me tira de la manga.\n\n«Por favor, ¿puedo organizar un [GetActivityType('activity_playdate').GetName]? ¡Quiero invitar a los demás niños de todo el reino y de más allá!»\n\nUn [GetActivityType('activity_playdate').GetNameNoTooltip] en mi corte costaría unos [mpie_court_meet_peers_cost|0][gold_i]."
 mpie_court.0001.a:0 "Por supuesto, pequeñ[mpie_court_child.Custom('ES_OA')]. ¡Yo me encargo!"
 mpie_court.0001.b:0 "Este año no, [mpie_court_child.GetFirstName]."
 mpie_court_meet_peers_accept_tt:0 "Se abre la planificación del [GetActivityType('activity_playdate').GetName] con [mpie_court_child.GetFirstName] como Joven anfitri[mpie_court_child.Custom('ES_OnOna')]. También puedes planearlo más adelante, durante el próximo año: un recordatorio en la parte superior de la pantalla te llevará allí"
 mpie_court_meet_peers_declined_tt:0 "[mpie_court_child.GetFirstName] no volverá a pedirlo hasta dentro de un año"
 mpie_court_meet_peers_started_title:0 "[mpie_court_child.GetFirstName] organiza un [GetActivityType('activity_playdate').GetNameNoTooltip]"
 mpie_court_meet_peers_started_desc:0 "[mpie_court_child.GetFirstName] ha tomado el relevo como anfitri[mpie_court_child.Custom('ES_OnOna')] del [GetActivityType('activity_playdate').GetName] que planeaste"

 # End report for a player ruler (mpie_court.0100)
 mpie_court.0100.t:0 "El [GetActivityType('activity_playdate').GetNameNoTooltip] de [mpie_report_host.GetFirstName]"
 mpie_court.0100.desc_guests_none:0 "El [GetActivityType('activity_playdate').GetName] que planeé para [mpie_report_host.GetFirstName] ha terminado, pero no vino ningún otro niño."
 mpie_court.0100.desc_guests_one:0 "El [GetActivityType('activity_playdate').GetName] que planeé para [mpie_report_host.GetFirstName] ha terminado. Vino otro niño."
 mpie_court.0100.desc_guests_many:0 "El [GetActivityType('activity_playdate').GetName] que planeé para [mpie_report_host.GetFirstName] ha terminado. Vinieron otros [mpie_report_guests|0] niños."
 mpie_court.0100.desc_family_sibling_and_more:0 "Entre ellos estaban [mpie_report_sibling.GetFirstName] y [mpie_report_family_others|0] más de la familia."
 mpie_court.0100.desc_family_sibling:0 "Entre ellos estaba [mpie_report_sibling.GetFirstName]."
 mpie_court.0100.desc_family_relative_and_more:0 "Entre ellos estaban [mpie_report_relative.GetFirstName] y [mpie_report_family_others|0] más de la familia."
 mpie_court.0100.desc_family_relative:0 "Entre ellos estaba [mpie_report_relative.GetFirstName], de la familia."
 mpie_court.0100.desc_family_none:0 "No vino nadie de la familia."
 mpie_court.0100.desc_nothing:0 ""
 mpie_court.0100.desc_friends_many:0 "\n\n[mpie_report_host.GetFirstName] hizo amistad con [mpie_report_friend.GetFirstName] y [mpie_report_friends_others|0] más."
 mpie_court.0100.desc_friends_one:0 "\n\n[mpie_report_host.GetFirstName] hizo amistad con [mpie_report_friend.GetFirstName]."
 mpie_court.0100.desc_friends_none:0 "\n\nEsta vez, [mpie_report_host.GetFirstName] no hizo nuevos amigos."
 mpie_court.0100.desc_rival:0 "Eso sí, [mpie_report_host.GetFirstName] se enemistó con [mpie_report_rival.GetFirstName]."
 mpie_court.0100.desc_rewards:0 "\n\nComo anfitri[mpie_report_host.Custom('ES_OnOna')], [mpie_report_host.GetFirstName] ganó prestigio, y ahora todos los invitados tienen mejor opinión de [mpie_report_host.Custom('ES_ElElla')]."
 mpie_court.0100.a:0 "Me alegra oírlo."

 # Reminder to plan a promised Meet Peers (common/important_actions/mpie_important_actions.txt)
 mpie_action_plan_court_meet_peers:0 "[GetActivityType('activity_playdate').GetNameNoTooltip] prometido"
