l_spanish:
 # Meet Peers guest invite rules
 mpie_invite_rule_neighbors_children:0 "Niños vecinos"
 mpie_invite_rule_same_faith_children:0 "Niños de la misma fe"
 mpie_invite_rule_opposite_sex_children:0 "Niños del sexo opuesto"
 mpie_invite_rule_nearby_player_children:0 "Niños jugadores cercanos"
 
 # Meet Peers cooldown reset decision
 mpie_reset_meet_peers_cooldown_decision:0 "Reiniciar tiempo de espera: [GetActivityType('activity_playdate').GetNameNoTooltip]"
 mpie_reset_meet_peers_cooldown_decision_tooltip:0 "Planea otra actividad [GetActivityType('activity_playdate').GetName] sin esperar a que termine el tiempo de espera"
 mpie_reset_meet_peers_cooldown_decision_desc:0 "#F ¿Por qué esperar años para volver a ver a mis compañeros? ¡Los invitaré de nuevo ahora mismo!#!"
 mpie_reset_meet_peers_cooldown_decision_confirm:0 "¡Invitémoslos de nuevo!"
 mpie_reset_meet_peers_cooldown_decision_effect_tt:0 "Tu próxima actividad [GetActivityType('activity_playdate').GetName] se puede planear de inmediato. Planearla inicia un nuevo tiempo de espera."
 
 # Game rule: cooldown reset
 rule_mpie_meet_peers_cooldown_reset:0 "Reinicio del tiempo de espera de Encuentro con rapaces"
 setting_mpie_meet_peers_cooldown_reset_disabled:0 "Desactivado"
 setting_mpie_meet_peers_cooldown_reset_disabled_desc:0 "La decisión de reiniciar el tiempo de espera de Encuentro con rapaces no está disponible."
 setting_mpie_meet_peers_cooldown_reset_enabled:0 "Activado"
 setting_mpie_meet_peers_cooldown_reset_enabled_desc:0 "Los jugadores pueden tomar la decisión de reiniciar el tiempo de espera de Encuentro con rapaces para planear el siguiente sin esperar."
 
 # Game rule: cooldown length
 rule_mpie_meet_peers_cooldown:0 "Tiempo de espera de Encuentro con rapaces"
 setting_mpie_meet_peers_cooldown_1_year:0 "1 año"
 setting_mpie_meet_peers_cooldown_1_year_desc:0 "Tras organizar un Encuentro con rapaces, un personaje debe esperar 1 año antes de organizar el siguiente."
 setting_mpie_meet_peers_cooldown_2_years:0 "2 años"
 setting_mpie_meet_peers_cooldown_2_years_desc:0 "Tras organizar un Encuentro con rapaces, un personaje debe esperar 2 años antes de organizar el siguiente."
 setting_mpie_meet_peers_cooldown_3_years:0 "3 años (juego base)"
 setting_mpie_meet_peers_cooldown_3_years_desc:0 "Tras organizar un Encuentro con rapaces, un personaje debe esperar 3 años antes de organizar el siguiente, como en el juego base."

 # Game rule: AI Meet Peers and player children
 rule_mpie_ai_invites_players:0 "Encuentros con rapaces de la IA y niños jugadores"
 setting_mpie_ai_invites_players_off:0 "Desactivado"
 setting_mpie_ai_invites_players_off_desc:0 "Los niños de la IA organizan Encuentros con rapaces como en el juego base y no buscan niños jugadores cercanos."
 setting_mpie_ai_invites_players_near:0 "Cercanos"
 setting_mpie_ai_invites_players_near_desc:0 "Los niños de la IA organizan Encuentros con rapaces más a menudo (como condes, una vez por infancia; como emperadores, hasta cuatro), invitan a niños jugadores del mismo reino o de uno vecino, o que viven cerca, y los organizan con más ganas cuando hay uno cerca."
 setting_mpie_ai_invites_players_near_and_faith:0 "Cercanos y misma fe"
 setting_mpie_ai_invites_players_near_and_faith_desc:0 "Como «Cercanos», y los niños de la IA también invitan a niños jugadores de su fe que viven más lejos."

 # Game rule: Meet Peers guests at war
 rule_mpie_meet_peers_guests_at_war:0 "Invitados en guerra a Encuentro con rapaces"
 setting_mpie_meet_peers_guests_at_war_disabled:0 "No permitido"
 setting_mpie_meet_peers_guests_at_war_disabled_desc:0 "Como en el juego base, los niños en guerra no pueden asistir a un Encuentro con rapaces."
 setting_mpie_meet_peers_guests_at_war_enabled:0 "Permitido para jugadores"
 setting_mpie_meet_peers_guests_at_war_enabled_desc:0 "Los niños jugadores en guerra pueden asistir igualmente a los Encuentros con rapaces como invitados. Los niños de la IA no cambian."
 
 # Cooldown tooltip (common/trigger_localization/mpie_trigger_localization.txt)
 MPIE_MEET_PEERS_ON_COOLDOWN_FIRST:0 "No puedes organizar otra actividad [GetActivityType('activity_playdate').GetName] hasta [GetCurrentDateWithDiff( GetVarTimeRemaining( CHARACTER.MakeScope, 'mpie_meet_peers_cooldown') )]"
 MPIE_MEET_PEERS_ON_COOLDOWN_THIRD:0 "[CHARACTER.GetShortUIName|U] no puede organizar otra actividad [GetActivityType('activity_playdate').GetName] hasta [GetCurrentDateWithDiff( GetVarTimeRemaining( CHARACTER.MakeScope, 'mpie_meet_peers_cooldown') )]"

 # Game rule: court children host Meet Peers
 game_rule_category_mpie_meet_peers:0 "Encuentro con rapaces"
 rule_mpie_court_children_meet_peers:0 "Los niños de la corte organizan Encuentros con rapaces"
 setting_mpie_court_children_meet_peers_off:0 "Desactivado"
 setting_mpie_court_children_meet_peers_off_desc:0 "Como en el juego base, solo los niños que poseen un título pueden organizar un Encuentro con rapaces."
 setting_mpie_court_children_meet_peers_kingdom:0 "Reyes y superiores"
 setting_mpie_court_children_meet_peers_kingdom_desc:0 "Los reyes y emperadores pueden planear un Encuentro con rapaces para un niño sin título de su corte, que luego lo organiza. Una vez al año, un niño también puede pedirlo: los gobernantes de la IA aceptan si pueden permitírselo, los jugadores pueden negarse. Cada corte organiza como máximo uno cada 2 años."
 setting_mpie_court_children_meet_peers_duchy:0 "Duques y superiores"
 setting_mpie_court_children_meet_peers_duchy_desc:0 "Como «Reyes y superiores», y también los hijos de los duques."
 mpie_meet_peers_refused_opinion:0 "Rechazó mi Encuentro con rapaces"

 # Court children host Meet Peers
 mpie_invite_rule_court_children:0 "Niños de la corte y de los vasallos"
 mpie_invite_rule_close_family:0 "$activity_invite_rule_close_family$"
 mpie_invite_rule_extended_family:0 "$activity_invite_rule_extended_family$"
 mpie_host_child:0 "Joven anfitrión"
 mpie_host_child_for_host:0 "Joven anfitrión"
 mpie_host_child_promised:0 "$mpie_host_child$"
 mpie_host_child_promised_for_host:0 "$mpie_host_child$"
 MPIE_COURT_MEET_PEERS_ON_COOLDOWN_FIRST:0 "Tu corte no puede organizar otra actividad [GetActivityType('activity_playdate').GetName] para un niño hasta [GetCurrentDateWithDiff( GetVarTimeRemaining( CHARACTER.MakeScope, 'mpie_court_meet_peers_cooldown') )]"
 MPIE_COURT_MEET_PEERS_ON_COOLDOWN_THIRD:0 "La corte de [CHARACTER.GetShortUIName] no puede organizar otra actividad [GetActivityType('activity_playdate').GetName] para un niño hasta [GetCurrentDateWithDiff( GetVarTimeRemaining( CHARACTER.MakeScope, 'mpie_court_meet_peers_cooldown') )]"
 mpie_organized_my_meet_peers_opinion:0 "Organizó mi Encuentro con rapaces"
 mpie_meet_peers_family_opinion:0 "Organizó un Encuentro con rapaces para nosotros"

 # Family first: guest acceptance (playdate guest_join_chance)
 MPIE_ACTIVITY_GUEST_HOST_SIBLING_REASON:0 "[ROOT.Char.GetSheHe|U] es hermano o hermana del anfitrión: $VALUE|=+0$"
 MPIE_ACTIVITY_GUEST_HOST_FAMILY_REASON:0 "[ROOT.Char.GetSheHe|U] es de la familia del anfitrión: $VALUE|=+0$"

 # Meet Peers goals (intents)
 mpie_befriend_peer_intent:0 "Entablar amistad con un compañero"
 mpie_befriend_peer_intent_desc:0 "Quieres que tu objetivo y tú seáis [friends|lE]. Cuando hayáis llegado los dos, suele surgir un momento a solas, con varias formas de ganarte su amistad. Es más fácil si ya le caes bien."
 mpie_learn_from_peer_intent:0 "Aprender de un compañero"
 mpie_learn_from_peer_intent_desc:0 "Quieres aprender de tu objetivo. Cuando hayáis llegado los dos, suele surgir una lección: un punto en la habilidad en la que más te aventaja, o en la segunda. Cuanto mayor sea la diferencia y mejor tu [learning|lE], más probabilidades tendrás."
 mpie_role_model_intent:0 "Modelo a seguir"
 mpie_role_model_intent_desc:0 "Admiras a tu objetivo. Cuando hayáis llegado los dos, suele surgir la ocasión de adoptar uno de sus [personality_traits|lE]. Es más fácil si sois amigos o tenéis una edad parecida."

 # Befriend a Peer encounter
 mpie_peer.1001.t:0 "Una amistad en ciernes"
 mpie_peer.1001.desc:0 "Desde que llegué, tengo ganas de conocer mejor [mpie_peer.Custom('ES_AlAla')] [mpie_peer.GetTitledFirstName|l]. Hoy por fin [mpie_peer.Custom('ES_LoLa')] encuentro a solas, botando una pelota contra el muro del jardín.\n\nSi quiero que seamos amigos, ¡esta es mi oportunidad!"
 mpie_peer.1001.a:0 "Pedirle que juegue conmigo ([mpie_befriend_chance|0]%)"
 mpie_peer.1001.b:0 "Llevarle unos dulces de regalo ([mpie_befriend_invest_chance|0]%)"
 mpie_peer.1001.f.prestige:0 "Invitar[mpie_peer.Custom('ES_LoLa')] a sentarse a mi lado en la mesa de honor ([mpie_befriend_invest_chance|0]%)"
 mpie_peer.1001.f.influence:0 "Prometer que hablaré en favor de su familia en la corte ([mpie_befriend_invest_chance|0]%)"
 mpie_peer.1001.c:0 "Hacerle reír hasta las lágrimas ([mpie_befriend_trait_chance|0]%)"
 mpie_peer.1001.d:0 "¡Te echo una carrera hasta el viejo roble! ([mpie_befriend_trait_chance|0]%)"
 mpie_peer.1001.e:0 "Preguntarle todo sobre su hogar ([mpie_befriend_trait_chance|0]%)"
 mpie_befriend_success_tt:0 "¡Amigos!"
 mpie_befriend_failure_tt:0 "Aún no sois amigos"

 # Learn from a Peer encounter
 mpie_peer.2001.t:0 "La lección de un compañero"
 mpie_peer.2001.desc.diplomacy:0 "[mpie_peer.Custom('ES_ElLa')|U] [mpie_peer.GetTitledFirstName|l] siempre parece saber qué decir. Los demás niños escuchan cuando habla, e incluso los mayores le sonríen.\n\nSi me enseñara cómo lo hace, podría mejorar mucho mi [diplomacy|lE]."
 mpie_peer.2001.desc.martial:0 "Cada vez que jugamos a la guerra, [mpie_peer.Custom('ES_ElLa')] [mpie_peer.GetTitledFirstName|l] es quien da las órdenes, y su bando siempre gana.\n\nSi me enseñara cómo lo hace, podría mejorar mucho mi habilidad [martial|lE]."
 mpie_peer.2001.desc.stewardship:0 "[mpie_peer.Custom('ES_ElLa')|U] [mpie_peer.GetTitledFirstName|l] lleva la cuenta de cada canica, cada dulce y cada moneda de cobre que intercambiamos, y de algún modo siempre acaba con más de lo que tenía al empezar.\n\nSi me enseñara cómo lo hace, podría mejorar mucho mi [stewardship|lE]."
 mpie_peer.2001.desc.intrigue:0 "Aquí no pasa nada sin que [mpie_peer.Custom('ES_ElLa')] [mpie_peer.GetTitledFirstName|l] se entere antes. Oye cada susurro y encuentra cada escondite.\n\nSi me enseñara cómo lo hace, podría mejorar mucho mi [intrigue|lE]."
 mpie_peer.2001.desc.learning:0 "[mpie_peer.Custom('ES_ElLa')|U] [mpie_peer.GetTitledFirstName|l] ha leído más libros que nadie que yo conozca, y sabe responder preguntas que dejan sin palabras hasta a nuestros tutores.\n\nSi me enseñara cómo lo hace, podría mejorar mucho mi [learning|lE]."
 mpie_peer.2001.desc.prowess:0 "[mpie_peer.Custom('ES_ElLa')|U] [mpie_peer.GetTitledFirstName|l] es rápid[mpie_peer.Custom('ES_OA')] y fuerte, y nunca suelta su espada de madera, por duro que sea el golpe.\n\nSi me enseñara cómo lo hace, podría mejorar mucho mi [prowess|lE]."
 mpie_peer.2001.desc.gap:0 "\n\n#weak Su ventaja sobre mí es de [mpie_learn_gap|0].#!"
 mpie_peer.2001.a.diplomacy:0 "Pedirle ayuda con mi [diplomacy|lE] ([mpie_learn_chance|0]%)"
 mpie_peer.2001.a.martial:0 "Pedirle ayuda con mi habilidad [martial|lE] ([mpie_learn_chance|0]%)"
 mpie_peer.2001.a.stewardship:0 "Pedirle ayuda con mi [stewardship|lE] ([mpie_learn_chance|0]%)"
 mpie_peer.2001.a.intrigue:0 "Pedirle ayuda con mi [intrigue|lE] ([mpie_learn_chance|0]%)"
 mpie_peer.2001.a.learning:0 "Pedirle ayuda con mi [learning|lE] ([mpie_learn_chance|0]%)"
 mpie_peer.2001.a.prowess:0 "Pedirle ayuda con mi [prowess|lE] ([mpie_learn_chance|0]%)"
 mpie_peer.2001.b.diplomacy:0 "Mejor preguntarle por la [diplomacy|lE] ([mpie_learn_chance_2|0]%)"
 mpie_peer.2001.b.martial:0 "Mejor preguntarle por lo [martial|lE] ([mpie_learn_chance_2|0]%)"
 mpie_peer.2001.b.stewardship:0 "Mejor preguntarle por la [stewardship|lE] ([mpie_learn_chance_2|0]%)"
 mpie_peer.2001.b.intrigue:0 "Mejor preguntarle por la [intrigue|lE] ([mpie_learn_chance_2|0]%)"
 mpie_peer.2001.b.learning:0 "Mejor preguntarle por el [learning|lE] ([mpie_learn_chance_2|0]%)"
 mpie_peer.2001.b.prowess:0 "Mejor preguntarle por la [prowess|lE] ([mpie_learn_chance_2|0]%)"
 mpie_peer.2001.c:0 "Rezar juntos primero para pedir sabiduría ([mpie_learn_invest_chance|0]%)"
 mpie_peer.2001.d.prestige:0 "Recordarle quién soy: no me lo negará ([mpie_learn_invest_chance|0]%)"
 mpie_peer.2001.d.influence:0 "Ofrecer a su familia mi favor en la corte a cambio ([mpie_learn_invest_chance|0]%)"
 mpie_learn_success_tt:0 "Lección aprendida"
 mpie_learn_failure_tt:0 "Lección en vano"
 mpie_learn_failure_effect_tt:0 "[mpie_peer.GetShortUIName] intentó enseñarte, pero no se te quedó nada"

 # Role Model encounter
 mpie_peer.3001.t:0 "Alguien a quien admirar"
 mpie_peer.3001.desc:0 "No puedo dejar de mirar [mpie_peer.Custom('ES_AlAla')] [mpie_peer.GetTitledFirstName|l]. Todos se fijan en lo [mpie_modeled_trait.GetName( mpie_peer )|l] que es, y parece que [mpie_peer.Custom('ES_LoLa')] admiran por ello.\n\n¿Podría ser yo un poco más así?"
 mpie_peer.3001.desc.second:0 "Aunque, claro, también puede ser muy [mpie_modeled_trait_2.GetName( mpie_peer )|l]…"
 mpie_peer.3001.a:0 "¡Yo también quiero ser [mpie_modeled_trait.GetName( ROOT.Char )|l]! ([mpie_role_model_chance|0]%)"
 mpie_peer.3001.b:0 "Quizá sea mejor ser [mpie_modeled_trait_2.GetName( ROOT.Char )|l] ([mpie_role_model_chance_2|0]%)"
 mpie_peer.3001.c:0 "Pedir al capellán que me ayude a ser [mpie_modeled_trait.GetName( ROOT.Char )|l] ([mpie_role_model_invest_chance|0]%)"
 mpie_role_model_success_tt:0 "Siguiendo su ejemplo"
 mpie_role_model_failure_tt:0 "Sigo siendo yo"
 mpie_role_model_failure_effect_tt:0 "Intentaste parecerte más a [mpie_peer.GetShortUIName], pero no iba contigo"
 mpie_role_model_adopted_effect_tt:0 "Has adoptado el [trait|lE] [mpie_adopted_trait.GetName( mpie_actor )] de [mpie_peer.GetShortUIName]"
 mpie_role_model_rejected_tt:0 "No pudo ser"
 mpie_role_model_rejected_effect_tt:0 "Al final no has podido adoptar el [trait|lE] [mpie_adopted_trait.GetName( mpie_actor )]"

 # Alternative pastime (instead of the goal; small sure reward)
 mpie_peer_pastime.games:0 "Mejor irme corriendo a jugar con los demás"
 mpie_peer_pastime.chapel:0 "Mejor escabullirme a la capilla"
 mpie_peer_pastime.quiet:0 "Mejor buscar un rincón tranquilo"
 mpie_peer_pastime.showoff:0 "Mejor lucirme delante de los demás"

