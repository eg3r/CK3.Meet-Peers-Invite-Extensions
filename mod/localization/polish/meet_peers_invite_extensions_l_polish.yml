 mpie_peer.2001.b.learning:0 "Poproszę raczej o inną lekcję ([learning|E], [mpie_learn_chance_2|0]%)"
 mpie_peer.2001.b.prowess:0 "Poproszę raczej o inną lekcję ([prowess|E], [mpie_learn_chance_2|0]%)"
 mpie_peer.2001.c:0 "Najpierw razem pomodlimy się o mądrość ([mpie_learn_invest_chance|0]%)"
 mpie_peer.2001.d.prestige:0 "Przypomnę [mpie_peer.Custom('PL_mu_jej')], kim jestem – nie odmówi mi! ([mpie_learn_invest_chance|0]%)"
 mpie_peer.2001.d.influence:0 "W zamian obiecam [mpie_peer.Custom('PL_jego_jej')] rodzinie moje względy na dworze ([mpie_learn_invest_chance|0]%)"
 mpie_learn_success_tt:0 "Lekcja odrobiona"
 mpie_learn_failure_tt:0 "Stracona lekcja"
 mpie_learn_failure_effect_tt:0 "[mpie_peer.GetShortUIName] próbował[Select_CString(mpie_peer.IsFemale, 'a', '')] cię uczyć, ale nic ci nie zostało w głowie"

 # Role Model encounter
 mpie_peer.3001.t:0 "Ktoś godny podziwu"
 mpie_peer.3001.desc:0 "[mpie_peer.GetTitledFirstName] wciąż przyciąga mój wzrok. Wszyscy widzą, że to [mpie_modeled_trait.GetName( mpie_peer )|l], i chyba właśnie za to [mpie_peer.Custom('PL_go_ja')] podziwiają.\n\nMoże i ja [Select_CString(ROOT.Char.IsFemale, 'mogłabym być taka', 'mógłbym być taki')]?"
 mpie_peer.3001.desc.second:0 "Z drugiej strony to także [mpie_modeled_trait_2.GetName( mpie_peer )|l]…"
 mpie_peer.3001.a:0 "Chcę być [Select_CString(ROOT.Char.IsFemale, 'taka', 'taki')] jak [mpie_peer.GetSheHe|l]! ([mpie_modeled_trait.GetName( ROOT.Char )|l], [mpie_role_model_chance|0]%)"
 mpie_peer.3001.b:0 "A może lepiej naśladować [mpie_peer.Custom('PL_go_ja')] w czymś innym? ([mpie_modeled_trait_2.GetName( ROOT.Char )|l], [mpie_role_model_chance_2|0]%)"
 mpie_peer.3001.c:0 "Poproszę kapelana, by pomógł mi stać się [Select_CString(ROOT.Char.IsFemale, 'taką', 'takim')] ([mpie_modeled_trait.GetName( ROOT.Char )|l], [mpie_role_model_invest_chance|0]%)"
 mpie_role_model_success_tt:0 "Za przykładem rówieśnika"
 mpie_role_model_failure_tt:0 "Wciąż sobą"
 mpie_role_model_failure_effect_tt:0 "Próba upodobnienia się do osoby, którą jest [mpie_peer.GetShortUIName], nie powiodła się – to nie w twoim stylu"
 mpie_role_model_adopted_effect_tt:0 "[trait|E] „[mpie_adopted_trait.GetName( mpie_actor )]” przejęta od osoby, którą jest [mpie_peer.GetShortUIName]"
