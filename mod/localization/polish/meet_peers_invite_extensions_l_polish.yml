 mpie_court.0100.desc_guests_one:0 "Zaplanowane przeze mnie [GetActivityType('activity_playdate').GetName|l], którego gospodarzem był[Select_CString(mpie_report_host.IsFemale, 'a', '')] [mpie_report_host.GetFirstName], dobiegło końca. Przyszło jeszcze jedno dziecko."
 mpie_court.0100.desc_guests_many:0 "Zaplanowane przeze mnie [GetActivityType('activity_playdate').GetName|l], którego gospodarzem był[Select_CString(mpie_report_host.IsFemale, 'a', '')] [mpie_report_host.GetFirstName], dobiegło końca. Przybyło innych dzieci: [mpie_report_guests|0]."
 mpie_court.0100.desc_family_sibling_and_more:0 "Wśród nich [mpie_report_sibling.GetFirstName] i jeszcze [mpie_report_family_others|0] z rodziny."
