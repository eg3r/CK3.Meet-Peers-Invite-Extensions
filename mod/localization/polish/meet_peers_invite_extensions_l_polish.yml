 # Meet Peers goals (intents)
 mpie_befriend_peer_intent:0 "Zaprzyjaźnienie się z rówieśnikiem"
 mpie_befriend_peer_intent_desc:0 "Chcesz, abyście ty i twój cel wyszli z tego spotkania jako [friends|El]. Gdy i ty, i twój cel dotrzecie na miejsce, zwykle nadarza się chwila sam na sam, a wraz z nią kilka sposobów, by zdobyć tę przyjaźń. Szanse rosną, jeśli cel już cię lubi."
 mpie_learn_from_peer_intent:0 "Nauka od rówieśnika"
 mpie_learn_from_peer_intent_desc:0 "Chcesz się czegoś nauczyć od swojego celu. Gdy i ty, i twój cel dotrzecie na miejsce, zwykle nadarza się lekcja, która może dać ci punkt w umiejętności, w której cel najbardziej cię wyprzedza, albo w jego drugiej najlepszej umiejętności. Im większa różnica i im lepsza twoja [learning|El], tym większa szansa."
 mpie_role_model_intent:0 "Wzór do naśladowania"
 mpie_role_model_intent_desc:0 "Twój cel jest dla ciebie wzorem. Gdy i ty, i twój cel dotrzecie na miejsce, zwykle nadarza się okazja, by pójść za jego przykładem – twoje [personality_traits|El] mogą wtedy wzbogacić się o jedną z cech celu. Szanse rosną, jeśli się przyjaźnicie lub jesteście w podobnym wieku."

 # Befriend a Peer encounter
 mpie_peer.1001.t:0 "Rodząca się przyjaźń"
 mpie_peer.1001.desc:0 "Odkąd tu przybył[Select_CString(ROOT.Char.IsFemale, 'am', 'em')], [mpie_peer.GetTitledFirstName] to ktoś, kogo chcę lepiej poznać. Dziś wreszcie zastaję [mpie_peer.Custom('PL_go_ja')] [Select_CString(mpie_peer.IsFemale, 'samą', 'samego')] w ogrodzie – odbija piłkę o mur.\n\nJeśli mamy się zaprzyjaźnić, to jest moja szansa!"
 mpie_peer.1001.a:0 "Zapytam, czy pobawi się ze mną ([mpie_befriend_chance|0]%)"
 mpie_peer.1001.b:0 "Przyniosę [mpie_peer.Custom('PL_mu_jej')] w prezencie trochę słodyczy ([mpie_befriend_invest_chance|0]%)"
 mpie_peer.1001.f.prestige:0 "Zaproszę [mpie_peer.Custom('PL_go_ja')] na miejsce obok mnie przy stole honorowym ([mpie_befriend_invest_chance|0]%)"
 mpie_peer.1001.f.influence:0 "Obiecam wstawić się na dworze za [mpie_peer.Custom('PL_jego_jej')] rodziną ([mpie_befriend_invest_chance|0]%)"
 mpie_peer.1001.c:0 "Rozśmieszę [mpie_peer.Custom('PL_go_ja')] do łez ([mpie_befriend_trait_chance|0]%)"
 mpie_peer.1001.d:0 "Kto pierwszy do starego dębu! ([mpie_befriend_trait_chance|0]%)"
 mpie_peer.1001.e:0 "Wypytam [mpie_peer.Custom('PL_go_ja')] o [mpie_peer.Custom('PL_jego_jej')] rodzinne strony ([mpie_befriend_trait_chance|0]%)"
 mpie_befriend_success_tt:0 "Nowa przyjaźń!"
 mpie_befriend_failure_tt:0 "Na przyjaźń jeszcze za wcześnie"

 # Learn from a Peer encounter
 mpie_peer.2001.t:0 "Lekcja od rówieśnika"
 mpie_peer.2001.desc.diplomacy:0 "[mpie_peer.GetTitledFirstName] zawsze wie, co powiedzieć. Inne dzieci słuchają, gdy się odzywa, a nawet dorośli uśmiechają się do [mpie_peer.Custom('PL_niego_niej')].\n\nGdyby [Select_CString(mpie_peer.IsFemale, 'zechciała', 'zechciał')] mi pokazać, jak to się robi, moja [diplomacy|El] mogłaby być o wiele lepsza."
 mpie_peer.2001.desc.martial:0 "Kiedy bawimy się w wojnę, to zawsze [mpie_peer.GetTitledFirstName] wydaje rozkazy, a [mpie_peer.Custom('PL_jego_jej')] strona nieodmiennie wygrywa.\n\nGdyby [Select_CString(mpie_peer.IsFemale, 'zechciała', 'zechciał')] mi pokazać, jak to się robi, moja [martial|El] mogłaby być o wiele lepsza."
 mpie_peer.2001.desc.stewardship:0 "[mpie_peer.GetTitledFirstName] liczy każdą kulkę, każdy cukierek i każdą miedzianą monetę, którymi się wymieniamy, i jakimś cudem zawsze ma na koniec więcej, niż miał[Select_CString(mpie_peer.IsFemale, 'a', '')] na początku.\n\nGdyby [Select_CString(mpie_peer.IsFemale, 'zechciała', 'zechciał')] mi pokazać, jak to się robi, moje [stewardship|El] mogłoby być o wiele lepsze."
 mpie_peer.2001.desc.intrigue:0 "O wszystkim, co się tu dzieje, [mpie_peer.GetTitledFirstName] dowiaduje się [Select_CString(mpie_peer.IsFemale, 'pierwsza', 'pierwszy')]. Słyszy każdy szept i znajduje każdą kryjówkę.\n\nGdyby [Select_CString(mpie_peer.IsFemale, 'zechciała', 'zechciał')] mi pokazać, jak to się robi, moja [intrigue|El] mogłaby być o wiele lepsza."
 mpie_peer.2001.desc.learning:0 "[mpie_peer.GetTitledFirstName] przeczytał[Select_CString(mpie_peer.IsFemale, 'a', '')] więcej ksiąg niż ktokolwiek, kogo znam, i potrafi odpowiedzieć na pytania, z którymi nie radzą sobie nawet nasi nauczyciele.\n\nGdyby [Select_CString(mpie_peer.IsFemale, 'zechciała', 'zechciał')] mi pokazać, jak to się robi, moja [learning|El] mogłaby być o wiele lepsza."
 mpie_peer.2001.desc.prowess:0 "[mpie_peer.GetTitledFirstName] jest [Select_CString(mpie_peer.IsFemale, 'szybka, silna', 'szybki, silny')] i nigdy nie wypuszcza z rąk swojego drewnianego miecza, choćby cios był nie wiadomo jak mocny.\n\nGdyby [Select_CString(mpie_peer.IsFemale, 'zechciała', 'zechciał')] mi pokazać, jak to się robi, moja [prowess|El] mogłaby być o wiele lepsza."
 mpie_peer.2001.desc.gap:0 "\n\n#weak [mpie_peer.GetSheHe|U] wyprzedza mnie o [mpie_learn_gap|0] pkt.#!"
 mpie_peer.2001.a.diplomacy:0 "Poproszę [mpie_peer.Custom('PL_go_ja')] o lekcję ([diplomacy|E], [mpie_learn_chance|0]%)"
 mpie_peer.2001.a.martial:0 "Poproszę [mpie_peer.Custom('PL_go_ja')] o lekcję ([martial|E], [mpie_learn_chance|0]%)"
 mpie_peer.2001.a.stewardship:0 "Poproszę [mpie_peer.Custom('PL_go_ja')] o lekcję ([stewardship|E], [mpie_learn_chance|0]%)"
 mpie_peer.2001.a.intrigue:0 "Poproszę [mpie_peer.Custom('PL_go_ja')] o lekcję ([intrigue|E], [mpie_learn_chance|0]%)"
 mpie_peer.2001.a.learning:0 "Poproszę [mpie_peer.Custom('PL_go_ja')] o lekcję ([learning|E], [mpie_learn_chance|0]%)"
 mpie_peer.2001.a.prowess:0 "Poproszę [mpie_peer.Custom('PL_go_ja')] o lekcję ([prowess|E], [mpie_learn_chance|0]%)"
 mpie_peer.2001.b.diplomacy:0 "Poproszę raczej o inną lekcję ([diplomacy|E], [mpie_learn_chance_2|0]%)"
