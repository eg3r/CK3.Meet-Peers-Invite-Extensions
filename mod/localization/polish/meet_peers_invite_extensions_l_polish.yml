 # Relationship reason
 mpie_friend_meet_peers_reason:0 "[CHARACTER.GetShortUIName|U] i [TARGET_CHARACTER.GetShortUIName] zosta[Select_CString( And(CHARACTER.IsFemale, TARGET_CHARACTER.IsFemale), 'ły', 'li')][Select_CString( Or(CHARACTER.IsLocalPlayer, TARGET_CHARACTER.IsLocalPlayer), 'ście', '')] [Select_CString( And(CHARACTER.IsFemale, TARGET_CHARACTER.IsFemale), 'przyjaciółkami', 'przyjaciółmi')] podczas wydarzenia [GetActivityType('activity_playdate').GetNameNoTooltip]."

 # Court children host Meet Peers (mpie_court_triggers.txt, events/activities/mpie_court_meet_peers_events.txt)
 mpie_court.0001.t:0 "Prośba na dworze"
