 mpie_court_meet_peers_accept_tt:0 "Otworzy się planowanie wydarzenia [GetActivityType('activity_playdate').GetName], a rolę Młodego gospodarza obejmie [mpie_court_child.GetFirstName]. Możesz je też zaplanować później, w ciągu najbliższego roku: przypomnienie u góry ekranu zaprowadzi cię do planowania"
