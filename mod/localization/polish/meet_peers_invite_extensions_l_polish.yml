 mpie_court.0100.desc_friends_one:0 "\n\n[mpie_report_host.GetFirstName] zyskał[Select_CString(mpie_report_host.IsFemale, 'a', '')] [Select_CString(mpie_report_friend.IsFemale, 'nową przyjaciółkę', 'nowego przyjaciela')]: [mpie_report_friend.GetFirstName]."
