 mpie_court.0100.desc_nothing:0 ""
 mpie_court.0100.desc_friends_many:0 "\n\n[mpie_report_host.GetFirstName] hat sich mit [mpie_report_friend.GetFirstName] und [mpie_report_friends_others|0] weiteren angefreundet."
