 mpie_peer_encounter_lost_tt:0 "Der Moment ist vorbei"

 # Activity log
 mpie_peer_goal_missed_log_title:0 "Eine verpasste Gelegenheit"
 mpie_peer_goal_missed_log:0 "[CHARACTER.GetTitledFirstName] bekam nie die Gelegenheit, Zeit mit [TARGET_CHARACTER.GetTitledFirstName] zu verbringen"
 mpie_peer_goal_no_moment_log_title:0 "Kein gemeinsamer Moment"
 mpie_peer_goal_no_moment_log:0 "[CHARACTER.GetTitledFirstName] fand nie den richtigen Moment mit [TARGET_CHARACTER.GetTitledFirstName]"
 mpie_peer_befriend_failed_log_title:0 "Noch keine Freunde"
 mpie_peer_befriend_failed_log:0 "[CHARACTER.GetTitledFirstName] versuchte, sich mit [TARGET_CHARACTER.GetTitledFirstName] anzufreunden, jedoch ohne Erfolg"
 mpie_peer_learned_log_title:0 "Lektion gelernt"
 mpie_peer_learned_log:0 "[CHARACTER.GetTitledFirstName] lernte das eine oder andere von [TARGET_CHARACTER.GetTitledFirstName]"
