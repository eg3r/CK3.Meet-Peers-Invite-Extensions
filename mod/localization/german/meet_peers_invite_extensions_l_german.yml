 mpie_peer_learn_failed_log:0 "[CHARACTER.GetTitledFirstName] versuchte, von [TARGET_CHARACTER.GetTitledFirstName] zu lernen, konnte aber nicht mithalten"
 mpie_peer_role_model_log_title:0 "Einem Vorbild nacheifern"
