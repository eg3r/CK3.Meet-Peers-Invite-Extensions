 mpie_peer_role_model_failed_log:0 "[CHARACTER.GetTitledFirstName] versuchte, mehr wie [TARGET_CHARACTER.GetTitledFirstName] zu sein, aber es passte nicht zu [CHARACTER.Custom('DE_PRO_PER_S_3P_D')]"

 # Relationship reason
 mpie_friend_meet_peers_reason:0 "[CHARACTER.GetShortUIName|U] und [TARGET_CHARACTER.GetShortUIName] wurden bei einem [GetActivityType('activity_playdate').GetNameNoTooltip] Freunde."

 # Court children host Meet Peers (mpie_court_triggers.txt, events/activities/mpie_court_meet_peers_events.txt)
 mpie_court.0001.t:0 "Eine Bitte bei Hofe"
 mpie_court.0001.desc:0 "Schon den ganzen Morgen folgt mir [mpie_court_child.GetFirstName] durch die Halle. Endlich zupft [mpie_court_child.Custom('DE_PRO_PER_S_3P_N')] mich am Ärmel.\n\n„Bitte, darf ich ein [GetActivityType('activity_playdate').GetName] ausrichten? Ich will die anderen Kinder einladen, aus dem ganzen Reich und von noch weiter her!“\n\nEin [GetActivityType('activity_playdate').GetNameNoTooltip] an meinem Hof würde etwa [mpie_court_meet_peers_cost|0][gold_i] kosten."
 mpie_court.0001.a:0 "Aber natürlich, Kleines. Ich kümmere mich darum!"
 mpie_court.0001.b:0 "Dieses Jahr nicht, [mpie_court_child.GetFirstName]."
 mpie_court_meet_peers_accept_tt:0 "Die Planung für das [GetActivityType('activity_playdate').GetName] öffnet sich mit [mpie_court_child.GetFirstName] als „Junger Gastgeber“. Ihr könnt es auch später im Laufe des nächsten Jahres planen: Eine Erinnerung am oberen Bildschirmrand bringt Euch dorthin"
 mpie_court_meet_peers_declined_tt:0 "[mpie_court_child.GetFirstName] wird ein Jahr lang nicht mehr fragen"
 mpie_court_meet_peers_started_title:0 "[mpie_court_child.GetFirstName] richtet ein [GetActivityType('activity_playdate').GetNameNoTooltip] aus"
 mpie_court_meet_peers_started_desc:0 "[mpie_court_child.GetFirstName] hat das von Euch geplante [GetActivityType('activity_playdate').GetName] als Gastgeber[mpie_court_child.Custom('DE_END_NOU_S_GS_N')] übernommen"

 # End report for a player ruler (mpie_court.0100)
 mpie_court.0100.t:0 "Das [GetActivityType('activity_playdate').GetNameNoTooltip] von [mpie_report_host.GetFirstName]"
 mpie_court.0100.desc_guests_none:0 "Das [GetActivityType('activity_playdate').GetName], das ich für [mpie_report_host.GetFirstName] geplant hatte, ist vorüber, doch keine anderen Kinder sind gekommen."
 mpie_court.0100.desc_guests_one:0 "Das [GetActivityType('activity_playdate').GetName], das ich für [mpie_report_host.GetFirstName] geplant hatte, ist vorüber. Ein anderes Kind ist gekommen."
 mpie_court.0100.desc_guests_many:0 "Das [GetActivityType('activity_playdate').GetName], das ich für [mpie_report_host.GetFirstName] geplant hatte, ist vorüber. [mpie_report_guests|0] andere Kinder sind gekommen."
 mpie_court.0100.desc_family_sibling_and_more:0 "Darunter waren [mpie_report_sibling.GetFirstName] und [mpie_report_family_others|0] weitere aus der Familie."
