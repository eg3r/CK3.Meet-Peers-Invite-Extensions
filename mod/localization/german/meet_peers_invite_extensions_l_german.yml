l_german:
 # Meet Peers guest invite rules
 mpie_invite_rule_neighbors_children:0 "Kinder aus Nachbarreichen"
 mpie_invite_rule_same_faith_children:0 "Kinder gleichen Glaubens"
 mpie_invite_rule_opposite_sex_children:0 "Kinder des anderen Geschlechts"
 mpie_invite_rule_nearby_player_children:0 "Spielerkinder in der Nähe"
 
 # Meet Peers cooldown reset decision
 mpie_reset_meet_peers_cooldown_decision:0 "Abklingzeit zurücksetzen: [GetActivityType('activity_playdate').GetNameNoTooltip]"
 mpie_reset_meet_peers_cooldown_decision_tooltip:0 "Plant eine weitere Aktivität [GetActivityType('activity_playdate').GetName], ohne die Abklingzeit abzuwarten"
 mpie_reset_meet_peers_cooldown_decision_desc:0 "#F Warum jahrelang warten, um meine Gefährten wiederzusehen? Ich lade sie sofort wieder ein!#!"
 mpie_reset_meet_peers_cooldown_decision_confirm:0 "Ladet sie wieder ein!"
 mpie_reset_meet_peers_cooldown_decision_effect_tt:0 "Eure nächste Aktivität [GetActivityType('activity_playdate').GetName] kann sofort geplant werden. Die Planung startet eine neue Abklingzeit."
 
 # Game rule: cooldown reset
 rule_mpie_meet_peers_cooldown_reset:0 "Spieltreffen-Abklingzeit zurücksetzen"
 setting_mpie_meet_peers_cooldown_reset_disabled:0 "Aus"
 setting_mpie_meet_peers_cooldown_reset_disabled_desc:0 "Die Entscheidung zum Zurücksetzen der Spieltreffen-Abklingzeit ist nicht verfügbar."
 setting_mpie_meet_peers_cooldown_reset_enabled:0 "An"
 setting_mpie_meet_peers_cooldown_reset_enabled_desc:0 "Spieler können die Entscheidung treffen, die Spieltreffen-Abklingzeit zurückzusetzen, um das nächste Spieltreffen ohne Wartezeit zu planen."
 
 # Game rule: cooldown length
 rule_mpie_meet_peers_cooldown:0 "Spieltreffen-Abklingzeit"
 setting_mpie_meet_peers_cooldown_1_year:0 "1 Jahr"
 setting_mpie_meet_peers_cooldown_1_year_desc:0 "Nach einem Spieltreffen muss ein Charakter 1 Jahr warten, bevor er das nächste ausrichten kann."
 setting_mpie_meet_peers_cooldown_2_years:0 "2 Jahre"
 setting_mpie_meet_peers_cooldown_2_years_desc:0 "Nach einem Spieltreffen muss ein Charakter 2 Jahre warten, bevor er das nächste ausrichten kann."
 setting_mpie_meet_peers_cooldown_3_years:0 "3 Jahre (Grundspiel)"
 setting_mpie_meet_peers_cooldown_3_years_desc:0 "Nach einem Spieltreffen muss ein Charakter 3 Jahre warten, bevor er das nächste ausrichten kann, wie im Grundspiel."

 # Game rule: AI Meet Peers and player children
 rule_mpie_ai_invites_players:0 "KI-Spieltreffen und Spielerkinder"
 setting_mpie_ai_invites_players_off:0 "Aus"
 setting_mpie_ai_invites_players_off_desc:0 "KI-Kinder richten Spieltreffen wie im Grundspiel aus und suchen nicht nach Spielerkindern in der Nähe."
 setting_mpie_ai_invites_players_near:0 "In der Nähe"
 setting_mpie_ai_invites_players_near_desc:0 "KI-Kinder richten öfter Spieltreffen aus (etwa einmal pro Kindheit als Graf, bis zu viermal als Kaiser), laden Spielerkinder aus demselben oder einem benachbarten Reich oder aus der Nähe ein und richten bereitwilliger welche aus, wenn eines in der Nähe ist."
 setting_mpie_ai_invites_players_near_and_faith:0 "In der Nähe und gleicher Glaube"
 setting_mpie_ai_invites_players_near_and_faith_desc:0 "Wie „In der Nähe“, und KI-Kinder laden auch Spielerkinder ihres Glaubens aus größerer Entfernung ein."

 # Game rule: Meet Peers guests at war
 rule_mpie_meet_peers_guests_at_war:0 "Spieltreffen-Gäste im Krieg"
 setting_mpie_meet_peers_guests_at_war_disabled:0 "Nicht erlaubt"
 setting_mpie_meet_peers_guests_at_war_disabled_desc:0 "Wie im Grundspiel können Kinder im Krieg nicht an einem Spieltreffen teilnehmen."
 setting_mpie_meet_peers_guests_at_war_enabled:0 "Für Spieler erlaubt"
 setting_mpie_meet_peers_guests_at_war_enabled_desc:0 "Spielerkinder im Krieg können trotzdem als Gäste an Spieltreffen teilnehmen. KI-Kinder bleiben unverändert."
 
 # Cooldown tooltip (common/trigger_localization/mpie_trigger_localization.txt)
 MPIE_MEET_PEERS_ON_COOLDOWN_FIRST:0 "Ihr könnt bis [GetCurrentDateWithDiff( GetVarTimeRemaining( CHARACTER.MakeScope, 'mpie_meet_peers_cooldown') )] keine weitere Aktivität [GetActivityType('activity_playdate').GetName] ausrichten"
 MPIE_MEET_PEERS_ON_COOLDOWN_THIRD:0 "[CHARACTER.GetShortUIName|U] kann bis [GetCurrentDateWithDiff( GetVarTimeRemaining( CHARACTER.MakeScope, 'mpie_meet_peers_cooldown') )] keine weitere Aktivität [GetActivityType('activity_playdate').GetName] ausrichten"

 # Game rule: court children host Meet Peers
 game_rule_category_mpie_meet_peers:0 "Spieltreffen"
 rule_mpie_court_children_meet_peers:0 "Hofkinder richten Spieltreffen aus"
 setting_mpie_court_children_meet_peers_off:0 "Aus"
 setting_mpie_court_children_meet_peers_off_desc:0 "Wie im Grundspiel können nur Kinder mit einem Titel ein Spieltreffen ausrichten."
 setting_mpie_court_children_meet_peers_kingdom:0 "Könige und höher"
 setting_mpie_court_children_meet_peers_kingdom_desc:0 "Könige und Kaiser können für ein Kind ohne Titel an ihrem Hof ein Spieltreffen planen, das das Kind dann ausrichtet. Einmal im Jahr kann ein Kind auch darum bitten: KI-Herrscher stimmen zu, wenn sie es sich leisten können, Spieler können ablehnen. Jeder Hof richtet höchstens alle 2 Jahre eines aus."
 setting_mpie_court_children_meet_peers_duchy:0 "Herzöge und höher"
 setting_mpie_court_children_meet_peers_duchy_desc:0 "Wie „Könige und höher“, und auch die Kinder von Herzögen."
 mpie_meet_peers_refused_opinion:0 "Hat mein Spieltreffen abgelehnt"

 # Court children host Meet Peers
 mpie_invite_rule_court_children:0 "Kinder von Hof und Vasallen"
 mpie_invite_rule_close_family:0 "$activity_invite_rule_close_family$"
 mpie_invite_rule_extended_family:0 "$activity_invite_rule_extended_family$"
 mpie_host_child:0 "Junger Gastgeber"
 mpie_host_child_for_host:0 "Junger Gastgeber"
 mpie_host_child_promised:0 "$mpie_host_child$"
 mpie_host_child_promised_for_host:0 "$mpie_host_child$"
 MPIE_COURT_MEET_PEERS_ON_COOLDOWN_FIRST:0 "Euer Hof kann bis [GetCurrentDateWithDiff( GetVarTimeRemaining( CHARACTER.MakeScope, 'mpie_court_meet_peers_cooldown') )] keine weitere Aktivität [GetActivityType('activity_playdate').GetName] für ein Kind ausrichten"
 MPIE_COURT_MEET_PEERS_ON_COOLDOWN_THIRD:0 "Der Hof von [CHARACTER.GetShortUIName] kann bis [GetCurrentDateWithDiff( GetVarTimeRemaining( CHARACTER.MakeScope, 'mpie_court_meet_peers_cooldown') )] keine weitere Aktivität [GetActivityType('activity_playdate').GetName] für ein Kind ausrichten"
 mpie_organized_my_meet_peers_opinion:0 "Hat mein Spieltreffen ausgerichtet"
 mpie_meet_peers_family_opinion:0 "Hat ein Spieltreffen für uns ausgerichtet"

 # Family first: guest acceptance (playdate guest_join_chance)
 MPIE_ACTIVITY_GUEST_HOST_SIBLING_REASON:0 "[ROOT.Char.Custom('DE_PRO_PER_S_3P_N')|U] gehört zu den Geschwistern des Gastgebers: $VALUE|=+0$"
 MPIE_ACTIVITY_GUEST_HOST_FAMILY_REASON:0 "[ROOT.Char.Custom('DE_PRO_PER_S_3P_N')|U] gehört zur Familie des Gastgebers: $VALUE|=+0$"

 # Meet Peers goals (intents)
 mpie_befriend_peer_intent:0 "Freundschaft schließen"
 mpie_befriend_peer_intent_desc:0 "Ihr wollt mit Eurer Zielperson [friends|E] werden. Sobald Ihr beide angekommen seid, ergibt sich meist ein Moment unter vier Augen, mit verschiedenen Möglichkeiten, ihre Freundschaft zu gewinnen. Die Aussichten sind besser, wenn sie Euch bereits mag."
 mpie_learn_from_peer_intent:0 "Von Gleichaltrigen lernen"
 mpie_learn_from_peer_intent_desc:0 "Ihr wollt von Eurer Zielperson lernen. Sobald Ihr beide angekommen seid, ergibt sich meist eine Lektion: ein Punkt in dem Wert, in dem sie Euch am weitesten voraus ist, oder in ihrem zweitbesten. Je größer der Abstand und je höher Eure [learning|E], desto besser die Aussichten."
 mpie_role_model_intent:0 "Vorbild"
 mpie_role_model_intent_desc:0 "Ihr seht zu Eurer Zielperson auf. Sobald Ihr beide angekommen seid, ergibt sich meist ein Moment, eine ihrer [personality_traits|E] zu übernehmen. Die Aussichten sind besser, wenn Ihr befreundet oder ungefähr gleich alt seid."

 # Befriend a Peer encounter
 mpie_peer.1001.t:0 "Eine Freundschaft bahnt sich an"
 mpie_peer.1001.desc:0 "Seit meiner Ankunft möchte ich [mpie_peer.GetTitledFirstName] besser kennenlernen. Heute treffe ich [mpie_peer.Custom('DE_PRO_PER_S_3P_A')] endlich allein an, wie [mpie_peer.Custom('DE_PRO_PER_S_3P_N')] einen Ball gegen die Gartenmauer prallen lässt.\n\nWenn ich will, dass wir Freunde werden, ist das jetzt meine Chance!"
 mpie_peer.1001.a:0 "Ich frage [mpie_peer.Custom('DE_PRO_PER_S_3P_A')], ob [mpie_peer.Custom('DE_PRO_PER_S_3P_N')] mit mir spielen will ([mpie_befriend_chance|0]%)"
 mpie_peer.1001.b:0 "Ich schenke [mpie_peer.Custom('DE_PRO_PER_S_3P_D')] ein paar Süßigkeiten ([mpie_befriend_invest_chance|0]%)"
 mpie_peer.1001.f.prestige:0 "Ich lade [mpie_peer.Custom('DE_PRO_PER_S_3P_A')] ein, an der hohen Tafel neben mir zu sitzen ([mpie_befriend_invest_chance|0]%)"
 mpie_peer.1001.f.influence:0 "Ich verspreche, mich bei Hofe für [mpie_peer.Custom('DE_PRO_POS_S_3P')]e Familie einzusetzen ([mpie_befriend_invest_chance|0]%)"
 mpie_peer.1001.c:0 "Ich bringe [mpie_peer.Custom('DE_PRO_PER_S_3P_A')] zum Lachen, bis [mpie_peer.Custom('DE_PRO_PER_S_3P_D')] die Tränen kommen ([mpie_befriend_trait_chance|0]%)"
 mpie_peer.1001.d:0 "Ich fordere [mpie_peer.Custom('DE_PRO_PER_S_3P_A')] zum Wettlauf bis zur alten Eiche heraus! ([mpie_befriend_trait_chance|0]%)"
 mpie_peer.1001.e:0 "Ich lasse mir von [mpie_peer.Custom('DE_PRO_PER_S_3P_D')] alles über [mpie_peer.Custom('DE_PRO_POS_S_3P')]e Heimat erzählen ([mpie_befriend_trait_chance|0]%)"
 mpie_befriend_success_tt:0 "Freunde!"
 mpie_befriend_failure_tt:0 "Noch keine Freunde"

 # Learn from a Peer encounter
 mpie_peer.2001.t:0 "Eine Lektion unter Gleichaltrigen"
 mpie_peer.2001.desc.diplomacy:0 "[mpie_peer.GetTitledFirstName] scheint immer zu wissen, was man sagen muss. Die anderen Kinder hören zu, wenn [mpie_peer.Custom('DE_PRO_PER_S_3P_N')] spricht, und selbst die Erwachsenen lächeln [mpie_peer.Custom('DE_PRO_PER_S_3P_D')] zu.\n\nWenn [mpie_peer.Custom('DE_PRO_PER_S_3P_N')] mir zeigen würde, wie es geht, könnte ich in [diplomacy|E] viel besser werden."
 mpie_peer.2001.desc.martial:0 "Immer wenn wir Krieg spielen, gibt [mpie_peer.GetTitledFirstName] die Befehle, und [mpie_peer.Custom('DE_PRO_POS_S_3P')]e Seite gewinnt jedes Mal.\n\nWenn [mpie_peer.Custom('DE_PRO_PER_S_3P_N')] mir zeigen würde, wie es geht, könnte ich in [martial|E] viel besser werden."
 mpie_peer.2001.desc.stewardship:0 "[mpie_peer.GetTitledFirstName] behält den Überblick über jede Murmel, jede Süßigkeit und jede Kupfermünze, die wir tauschen, und hat am Ende irgendwie immer mehr, als [mpie_peer.Custom('DE_PRO_PER_S_3P_N')] am Anfang hatte.\n\nWenn [mpie_peer.Custom('DE_PRO_PER_S_3P_N')] mir zeigen würde, wie es geht, könnte ich in [stewardship|E] viel besser werden."
 mpie_peer.2001.desc.intrigue:0 "Hier geschieht nichts, ohne dass [mpie_peer.GetTitledFirstName] es als Erstes erfährt. [mpie_peer.Custom('DE_PRO_PER_S_3P_N')|U] hört jedes Flüstern und findet jedes Versteck.\n\nWenn [mpie_peer.Custom('DE_PRO_PER_S_3P_N')] mir zeigen würde, wie es geht, könnte ich im [intrigue|E] viel besser werden."
 mpie_peer.2001.desc.learning:0 "[mpie_peer.GetTitledFirstName] hat mehr Bücher gelesen als irgendwer sonst, den ich kenne, und [mpie_peer.Custom('DE_PRO_PER_S_3P_N')] kann Fragen beantworten, an denen sich sogar unsere Lehrer die Zähne ausbeißen.\n\nWenn [mpie_peer.Custom('DE_PRO_PER_S_3P_N')] mir zeigen würde, wie es geht, könnte ich meine [learning|E] deutlich verbessern."
 mpie_peer.2001.desc.prowess:0 "[mpie_peer.GetTitledFirstName] ist flink und stark und lässt [mpie_peer.Custom('DE_PRO_POS_S_3P')] Holzschwert nie fallen, ganz gleich, wie hart der Schlag ist.\n\nWenn [mpie_peer.Custom('DE_PRO_PER_S_3P_N')] mir zeigen würde, wie es geht, könnte ich mein [prowess|E] deutlich verbessern."
 mpie_peer.2001.desc.gap:0 "\n\n#weak [mpie_peer.Custom('DE_PRO_PER_S_3P_N')|U] ist mir um [mpie_learn_gap|0] voraus.#!"
 mpie_peer.2001.a.diplomacy:0 "Ich bitte [mpie_peer.Custom('DE_PRO_PER_S_3P_A')], mir [diplomacy|E] beizubringen ([mpie_learn_chance|0]%)"
 mpie_peer.2001.a.martial:0 "Ich bitte [mpie_peer.Custom('DE_PRO_PER_S_3P_A')], mir [martial|E] beizubringen ([mpie_learn_chance|0]%)"
 mpie_peer.2001.a.stewardship:0 "Ich bitte [mpie_peer.Custom('DE_PRO_PER_S_3P_A')], mir [stewardship|E] beizubringen ([mpie_learn_chance|0]%)"
 mpie_peer.2001.a.intrigue:0 "Ich bitte [mpie_peer.Custom('DE_PRO_PER_S_3P_A')], mir das [intrigue|E] beizubringen ([mpie_learn_chance|0]%)"
 mpie_peer.2001.a.learning:0 "Ich bitte [mpie_peer.Custom('DE_PRO_PER_S_3P_A')], meine [learning|E] zu fördern ([mpie_learn_chance|0]%)"
 mpie_peer.2001.a.prowess:0 "Ich bitte [mpie_peer.Custom('DE_PRO_PER_S_3P_A')], mein [prowess|E] zu schulen ([mpie_learn_chance|0]%)"
 mpie_peer.2001.b.diplomacy:0 "Ich bitte lieber um Rat für meine [diplomacy|E] ([mpie_learn_chance_2|0]%)"
 mpie_peer.2001.b.martial:0 "Ich bitte lieber um Rat für meine [martial|E] ([mpie_learn_chance_2|0]%)"
 mpie_peer.2001.b.stewardship:0 "Ich bitte lieber um Rat für meine [stewardship|E] ([mpie_learn_chance_2|0]%)"
 mpie_peer.2001.b.intrigue:0 "Ich bitte lieber um Rat für mein [intrigue|E] ([mpie_learn_chance_2|0]%)"
 mpie_peer.2001.b.learning:0 "Ich bitte lieber um Rat für meine [learning|E] ([mpie_learn_chance_2|0]%)"
 mpie_peer.2001.b.prowess:0 "Ich bitte lieber um Rat für mein [prowess|E] ([mpie_learn_chance_2|0]%)"
 mpie_peer.2001.c:0 "Wir beten zuerst gemeinsam um Weisheit ([mpie_learn_invest_chance|0]%)"
 mpie_peer.2001.d.prestige:0 "Ich erinnere [mpie_peer.Custom('DE_PRO_PER_S_3P_A')] daran, wer ich bin – [mpie_peer.Custom('DE_PRO_PER_S_3P_N')] wird es mir nicht abschlagen ([mpie_learn_invest_chance|0]%)"
 mpie_peer.2001.d.influence:0 "Ich biete [mpie_peer.Custom('DE_PRO_POS_S_3P')]er Familie im Gegenzug meine Gunst bei Hofe an ([mpie_learn_invest_chance|0]%)"
 mpie_learn_success_tt:0 "Lektion gelernt"
 mpie_learn_failure_tt:0 "Vergebliche Lektion"
 mpie_learn_failure_effect_tt:0 "[mpie_peer.GetShortUIName] hat versucht, Euch etwas beizubringen, aber es ist nicht hängen geblieben"

 # Role Model encounter
 mpie_peer.3001.t:0 "Ein leuchtendes Vorbild"
 mpie_peer.3001.desc:0 "Ich kann den Blick einfach nicht von [mpie_peer.GetTitledFirstName] lassen. „[mpie_modeled_trait.GetName( mpie_peer )]“ – so beschreibt [mpie_peer.Custom('DE_PRO_PER_S_3P_A')] jeder, und alle scheinen [mpie_peer.Custom('DE_PRO_PER_S_3P_A')] dafür zu bewundern.\n\nVielleicht könnte ich auch ein bisschen so sein?"
 mpie_peer.3001.desc.second:0 "Andererseits gilt [mpie_peer.Custom('DE_PRO_PER_S_3P_N')] auch als „[mpie_modeled_trait_2.GetName( mpie_peer )]“ …"
 mpie_peer.3001.a:0 "Ich will auch so werden: „[mpie_modeled_trait.GetName( ROOT.Char )]“! ([mpie_role_model_chance|0]%)"
 mpie_peer.3001.b:0 "Oder doch lieber „[mpie_modeled_trait_2.GetName( ROOT.Char )]“? ([mpie_role_model_chance_2|0]%)"
 mpie_peer.3001.c:0 "Ich bitte den Hofgeistlichen, mir zu helfen, „[mpie_modeled_trait.GetName( ROOT.Char )]“ zu werden ([mpie_role_model_invest_chance|0]%)"
 mpie_role_model_success_tt:0 "Einem Vorbild nacheifern"
 mpie_role_model_failure_tt:0 "Immer noch ich selbst"
 mpie_role_model_failure_effect_tt:0 "Ihr habt versucht, mehr wie [mpie_peer.GetShortUIName] zu sein, aber es passte nicht zu Euch"
 mpie_role_model_adopted_effect_tt:0 "Hat die [trait|E] „[mpie_adopted_trait.GetName( mpie_actor )]“ von [mpie_peer.GetShortUIName] übernommen"
 mpie_role_model_rejected_tt:0 "Es sollte nicht sein"
 mpie_role_model_rejected_effect_tt:0 "Ihr konntet die [trait|E] „[mpie_adopted_trait.GetName( mpie_actor )]“ doch nicht übernehmen"

