l_french:
 # Meet Peers guest invite rules
 mpie_invite_rule_neighbors_children:0 "Enfants voisins"
 mpie_invite_rule_same_faith_children:0 "Enfants de la même foi"
 mpie_invite_rule_opposite_sex_children:0 "Enfants du sexe opposé"
 mpie_invite_rule_nearby_player_children:0 "Enfants joueurs proches"
 
 # Meet Peers cooldown reset decision
 mpie_reset_meet_peers_cooldown_decision:0 "Réinitialiser le délai : [GetActivityType('activity_playdate').GetNameNoTooltip]"
 mpie_reset_meet_peers_cooldown_decision_tooltip:0 "Organiser à nouveau : [GetActivityType('activity_playdate').GetName], sans attendre la fin du délai"
 mpie_reset_meet_peers_cooldown_decision_desc:0 "#F Pourquoi attendre des années pour revoir mes pairs ? Je vais les inviter de nouveau dès maintenant !#!"
 mpie_reset_meet_peers_cooldown_decision_confirm:0 "Invitons-les à nouveau !"
 mpie_reset_meet_peers_cooldown_decision_effect_tt:0 "Vous pouvez organiser immédiatement votre prochaine activité [GetActivityType('activity_playdate').GetName]. L'organiser lance un nouveau délai."
 
 # Game rule: cooldown reset
 rule_mpie_meet_peers_cooldown_reset:0 "Réinitialisation du délai de Rencontre des pairs"
 setting_mpie_meet_peers_cooldown_reset_disabled:0 "Désactivé"
 setting_mpie_meet_peers_cooldown_reset_disabled_desc:0 "La décision de réinitialiser le délai de Rencontre des pairs n'est pas disponible."
 setting_mpie_meet_peers_cooldown_reset_enabled:0 "Activé"
 setting_mpie_meet_peers_cooldown_reset_enabled_desc:0 "Les joueurs peuvent prendre la décision de réinitialiser le délai de Rencontre des pairs pour organiser la suivante sans attendre."
 
 # Game rule: cooldown length
 rule_mpie_meet_peers_cooldown:0 "Délai de Rencontre des pairs"
 setting_mpie_meet_peers_cooldown_1_year:0 "1 an"
 setting_mpie_meet_peers_cooldown_1_year_desc:0 "Après avoir organisé une Rencontre des pairs, un personnage doit attendre 1 an avant d'en organiser une autre."
 setting_mpie_meet_peers_cooldown_2_years:0 "2 ans"
 setting_mpie_meet_peers_cooldown_2_years_desc:0 "Après avoir organisé une Rencontre des pairs, un personnage doit attendre 2 ans avant d'en organiser une autre."
 setting_mpie_meet_peers_cooldown_3_years:0 "3 ans (jeu de base)"
 setting_mpie_meet_peers_cooldown_3_years_desc:0 "Après avoir organisé une Rencontre des pairs, un personnage doit attendre 3 ans avant d'en organiser une autre, comme dans le jeu de base."

 # Game rule: AI Meet Peers and player children
 rule_mpie_ai_invites_players:0 "Rencontres des pairs de l'IA et enfants joueurs"
 setting_mpie_ai_invites_players_off:0 "Désactivé"
 setting_mpie_ai_invites_players_off_desc:0 "Les enfants de l'IA organisent des Rencontres des pairs comme dans le jeu de base et ne recherchent pas les enfants joueurs proches."
 setting_mpie_ai_invites_players_near:0 "Proches"
 setting_mpie_ai_invites_players_near_desc:0 "Les enfants de l'IA organisent plus souvent des Rencontres des pairs (environ une fois par enfance pour un comte, jusqu'à quatre fois pour un empereur), invitent les enfants joueurs du même royaume, d'un royaume voisin ou vivant à proximité, et en organisent plus volontiers quand l'un d'eux est proche."
 setting_mpie_ai_invites_players_near_and_faith:0 "Proches et même foi"
 setting_mpie_ai_invites_players_near_and_faith_desc:0 "Comme « Proches », et les enfants de l'IA invitent aussi les enfants joueurs de leur foi venant de plus loin."

 # Game rule: Meet Peers guests at war
 rule_mpie_meet_peers_guests_at_war:0 "Invités en guerre à la Rencontre des pairs"
 setting_mpie_meet_peers_guests_at_war_disabled:0 "Non autorisé"
 setting_mpie_meet_peers_guests_at_war_disabled_desc:0 "Comme dans le jeu de base, les enfants en guerre ne peuvent pas assister à une Rencontre des pairs."
 setting_mpie_meet_peers_guests_at_war_enabled:0 "Autorisé pour les joueurs"
 setting_mpie_meet_peers_guests_at_war_enabled_desc:0 "Les enfants joueurs en guerre peuvent tout de même assister aux Rencontres des pairs en tant qu'invités. Les enfants de l'IA ne changent pas."
 
 # Cooldown tooltip (common/trigger_localization/mpie_trigger_localization.txt)
 MPIE_MEET_PEERS_ON_COOLDOWN_FIRST:0 "Vous ne pouvez pas organiser une nouvelle activité [GetActivityType('activity_playdate').GetName] avant [GetCurrentDateWithDiff( GetVarTimeRemaining( CHARACTER.MakeScope, 'mpie_meet_peers_cooldown') )]"
 MPIE_MEET_PEERS_ON_COOLDOWN_THIRD:0 "[CHARACTER.GetShortUIName|U] ne peut pas organiser une nouvelle activité [GetActivityType('activity_playdate').GetName] avant [GetCurrentDateWithDiff( GetVarTimeRemaining( CHARACTER.MakeScope, 'mpie_meet_peers_cooldown') )]"

 # Game rule: court children host Meet Peers
 game_rule_category_mpie_meet_peers:0 "Rencontre des pairs"
 rule_mpie_court_children_meet_peers:0 "Rencontres des pairs des enfants de la cour"
 setting_mpie_court_children_meet_peers_off:0 "Désactivé"
 setting_mpie_court_children_meet_peers_off_desc:0 "Comme dans le jeu de base, seuls les enfants qui détiennent un titre peuvent organiser une Rencontre des pairs."
 setting_mpie_court_children_meet_peers_kingdom:0 "Rois et plus"
 setting_mpie_court_children_meet_peers_kingdom_desc:0 "Les rois et empereurs peuvent planifier une Rencontre des pairs pour un enfant sans titre de leur cour, qui l'organise ensuite. Une fois par an, un enfant peut aussi la demander : les dirigeants de l'IA acceptent s'ils en ont les moyens, les joueurs peuvent refuser. Chaque cour en organise au plus une tous les 2 ans."
 setting_mpie_court_children_meet_peers_duchy:0 "Ducs et plus"
 setting_mpie_court_children_meet_peers_duchy_desc:0 "Comme « Rois et plus », et aussi les enfants des ducs."
 mpie_meet_peers_refused_opinion:0 "A refusé ma Rencontre des pairs"

 # Court children host Meet Peers
 mpie_invite_rule_court_children:0 "Enfants de la cour et des vassaux"
 mpie_invite_rule_close_family:0 "$activity_invite_rule_close_family$"
 mpie_invite_rule_extended_family:0 "$activity_invite_rule_extended_family$"
 mpie_host_child:0 "Jeune hôte"
 mpie_host_child_for_host:0 "Jeune hôte"
 mpie_host_child_promised:0 "$mpie_host_child$"
 mpie_host_child_promised_for_host:0 "$mpie_host_child$"
 MPIE_COURT_MEET_PEERS_ON_COOLDOWN_FIRST:0 "Votre cour ne peut pas organiser une nouvelle activité [GetActivityType('activity_playdate').GetName] pour un enfant avant [GetCurrentDateWithDiff( GetVarTimeRemaining( CHARACTER.MakeScope, 'mpie_court_meet_peers_cooldown') )]"
 MPIE_COURT_MEET_PEERS_ON_COOLDOWN_THIRD:0 "La cour de [CHARACTER.GetShortUIName] ne peut pas organiser une nouvelle activité [GetActivityType('activity_playdate').GetName] pour un enfant avant [GetCurrentDateWithDiff( GetVarTimeRemaining( CHARACTER.MakeScope, 'mpie_court_meet_peers_cooldown') )]"
 mpie_organized_my_meet_peers_opinion:0 "A organisé ma Rencontre des pairs"
 mpie_meet_peers_family_opinion:0 "A organisé une Rencontre des pairs pour nous"

 # Family first: guest acceptance (playdate guest_join_chance)
 MPIE_ACTIVITY_GUEST_HOST_SIBLING_REASON:0 "[ROOT.Char.GetSheHe|U] est de la fratrie de l'hôte : $VALUE|=+0$"
 MPIE_ACTIVITY_GUEST_HOST_FAMILY_REASON:0 "[ROOT.Char.GetSheHe|U] est de la famille de l'hôte : $VALUE|=+0$"

 # Meet Peers goals (intents)
 mpie_befriend_peer_intent:0 "Gagner l'amitié d'un pair"
 mpie_befriend_peer_intent_desc:0 "Vous souhaitez que votre cible et vous deveniez [friends|El]. Une fois votre cible et vous sur place, un moment en tête-à-tête se présente généralement, avec plusieurs façons de gagner son amitié. C'est plus probable si votre cible vous apprécie déjà."
 mpie_learn_from_peer_intent:0 "Apprendre d'un pair"
 mpie_learn_from_peer_intent_desc:0 "Vous souhaitez apprendre auprès de votre cible. Une fois votre cible et vous sur place, une leçon se présente généralement : un point dans l'aptitude où elle a le plus d'avance sur vous, ou dans sa deuxième meilleure aptitude. Plus l'écart est grand et plus votre [learning|El] est élevée, meilleures sont vos chances."
 mpie_role_model_intent:0 "Prendre exemple sur un pair"
 mpie_role_model_intent_desc:0 "Vous admirez votre cible. Une fois votre cible et vous sur place, l'occasion se présente généralement d'adopter l'un de ses [personality_traits|El]. C'est plus probable si une amitié vous unit ou si vous avez presque le même âge."

 # Befriend a Peer encounter
 mpie_peer.1001.t:0 "Une amitié naissante"
 mpie_peer.1001.desc:0 "Depuis mon arrivée, je rêve de mieux connaître [mpie_peer.Custom('FR_le_Char_Pi')][mpie_peer.GetTitledFirstName]. Aujourd'hui, je [mpie_peer.Custom('FR_LeLa')] trouve enfin seul[mpie_peer.Custom('FR_E')], en train de faire rebondir un ballon contre le mur du jardin.\n\nSi je veux gagner son amitié, c'est le moment ou jamais !"
 mpie_peer.1001.a:0 "Lui demander de jouer avec moi ([mpie_befriend_chance|0]%)"
 mpie_peer.1001.b:0 "Lui apporter des friandises en cadeau ([mpie_befriend_invest_chance|0]%)"
 mpie_peer.1001.f.prestige:0 "L'inviter à s'asseoir à mes côtés à la table d'honneur ([mpie_befriend_invest_chance|0]%)"
 mpie_peer.1001.f.influence:0 "Promettre de parler en faveur de sa famille à la cour ([mpie_befriend_invest_chance|0]%)"
 mpie_peer.1001.c:0 "[mpie_peer.Custom('FR_LeLa')|U] faire rire aux larmes ([mpie_befriend_trait_chance|0]%)"
 mpie_peer.1001.d:0 "[mpie_peer.Custom('FR_LeLa')|U] défier à la course jusqu'au vieux chêne ! ([mpie_befriend_trait_chance|0]%)"
 mpie_peer.1001.e:0 "Lui poser mille questions sur son pays natal ([mpie_befriend_trait_chance|0]%)"
 mpie_befriend_success_tt:0 "Une nouvelle amitié !"
 mpie_befriend_failure_tt:0 "L'amitié attendra"

 # Learn from a Peer encounter
 mpie_peer.2001.t:0 "La leçon d'un pair"
 mpie_peer.2001.desc.diplomacy:0 "[mpie_peer.Custom('FR_le_Char_Pi')|U][mpie_peer.GetTitledFirstName] semble toujours savoir quoi dire. Les autres enfants l'écoutent quand [mpie_peer.GetSheHe] parle, et même les grandes personnes lui sourient.\n\n[mpie_peer.Custom('FR_SilSielle')|U] me montrait comment faire, je pourrais faire de grands progrès en [diplomacy|El]."
 mpie_peer.2001.desc.martial:0 "Chaque fois que nous jouons à la guerre, c'est [mpie_peer.Custom('FR_le_Char_Pi')][mpie_peer.GetTitledFirstName] qui donne les ordres, et son camp gagne toujours.\n\n[mpie_peer.Custom('FR_SilSielle')|U] me montrait comment faire, je pourrais faire de grands progrès en [martial|El]."
 mpie_peer.2001.desc.stewardship:0 "[mpie_peer.Custom('FR_le_Char_Pi')|U][mpie_peer.GetTitledFirstName] tient le compte de chaque bille, friandise et piécette de cuivre que nous échangeons, et finit toujours, on ne sait comment, avec plus qu'au départ.\n\n[mpie_peer.Custom('FR_SilSielle')|U] me montrait comment faire, je pourrais faire de grands progrès en [stewardship|El]."
 mpie_peer.2001.desc.intrigue:0 "Rien ne se passe ici sans que [mpie_peer.Custom('FR_le_Char_Pi')][mpie_peer.GetTitledFirstName] le sache en premier. [mpie_peer.GetSheHe|U] entend chaque murmure et trouve chaque cachette.\n\n[mpie_peer.Custom('FR_SilSielle')|U] me montrait comment faire, je pourrais faire de grands progrès en [intrigue|El]."
 mpie_peer.2001.desc.learning:0 "[mpie_peer.Custom('FR_le_Char_Pi')|U][mpie_peer.GetTitledFirstName] a lu plus de livres que quiconque de ma connaissance, et [mpie_peer.GetSheHe] sait répondre à des questions qui laissent même nos précepteurs sans voix.\n\n[mpie_peer.Custom('FR_SilSielle')|U] me montrait comment faire, je pourrais faire de grands progrès en [learning|El]."
 mpie_peer.2001.desc.prowess:0 "[mpie_peer.Custom('FR_le_Char_Pi')|U][mpie_peer.GetTitledFirstName] est rapide, fort[mpie_peer.Custom('FR_E')] et ne lâche jamais son épée de bois, si rude que soit le coup.\n\n[mpie_peer.Custom('FR_SilSielle')|U] me montrait comment faire, je pourrais faire de grands progrès en [prowess|El]."
 mpie_peer.2001.desc.gap:0 "\n\n#weak [mpie_peer.GetSheHe|U] a [mpie_learn_gap|0] d'avance sur moi.#!"
 mpie_peer.2001.a.diplomacy:0 "Lui demander une leçon de [diplomacy|El] ([mpie_learn_chance|0]%)"
 mpie_peer.2001.a.martial:0 "Lui demander une leçon de [martial|El] ([mpie_learn_chance|0]%)"
 mpie_peer.2001.a.stewardship:0 "Lui demander une leçon d'[stewardship|El] ([mpie_learn_chance|0]%)"
 mpie_peer.2001.a.intrigue:0 "Lui demander une leçon d'[intrigue|El] ([mpie_learn_chance|0]%)"
 mpie_peer.2001.a.learning:0 "Lui demander une leçon d'[learning|El] ([mpie_learn_chance|0]%)"
 mpie_peer.2001.a.prowess:0 "Lui demander une leçon de [prowess|El] ([mpie_learn_chance|0]%)"
 mpie_peer.2001.b.diplomacy:0 "L'interroger plutôt sur la [diplomacy|El] ([mpie_learn_chance_2|0]%)"
 mpie_peer.2001.b.martial:0 "L'interroger plutôt sur la [martial|El] ([mpie_learn_chance_2|0]%)"
 mpie_peer.2001.b.stewardship:0 "L'interroger plutôt sur l'[stewardship|El] ([mpie_learn_chance_2|0]%)"
 mpie_peer.2001.b.intrigue:0 "L'interroger plutôt sur l'[intrigue|El] ([mpie_learn_chance_2|0]%)"
 mpie_peer.2001.b.learning:0 "L'interroger plutôt sur l'[learning|El] ([mpie_learn_chance_2|0]%)"
 mpie_peer.2001.b.prowess:0 "L'interroger plutôt sur la [prowess|El] ([mpie_learn_chance_2|0]%)"
 mpie_peer.2001.c:0 "Réciter d'abord ensemble une prière pour la sagesse ([mpie_learn_invest_chance|0]%)"
 mpie_peer.2001.d.prestige:0 "Lui rappeler qui je suis : [mpie_peer.GetSheHe] ne me refusera rien ([mpie_learn_invest_chance|0]%)"
 mpie_peer.2001.d.influence:0 "En échange, promettre à sa famille mon appui à la cour ([mpie_learn_invest_chance|0]%)"
 mpie_learn_success_tt:0 "Une leçon retenue"
 mpie_learn_failure_tt:0 "Une leçon perdue"
 mpie_learn_failure_effect_tt:0 "[mpie_peer.Custom('FR_le_Char_U_Pi')|U][mpie_peer.GetShortUIName] a essayé de vous apprendre quelque chose, mais vous n'avez rien retenu"

 # Role Model encounter
 mpie_peer.3001.t:0 "Un modèle à suivre"
 mpie_peer.3001.desc:0 "Je n'arrive pas à quitter [mpie_peer.Custom('FR_le_Char_Pi')][mpie_peer.GetTitledFirstName] des yeux. Tout le monde remarque à quel point [mpie_peer.GetSheHe] est [mpie_modeled_trait.GetName( mpie_peer )|l], et tous semblent l'admirer pour cela.\n\nEt si je lui ressemblais un peu plus ?"
 mpie_peer.3001.desc.second:0 "Mais [mpie_peer.GetSheHe] sait aussi se montrer si [mpie_modeled_trait_2.GetName( mpie_peer )|l]..."
 mpie_peer.3001.a:0 "Moi aussi, je veux être [mpie_modeled_trait.GetName( ROOT.Char )|l] ! ([mpie_role_model_chance|0]%)"
 mpie_peer.3001.b:0 "Peut-être devrais-je plutôt être [mpie_modeled_trait_2.GetName( ROOT.Char )|l] ([mpie_role_model_chance_2|0]%)"
 mpie_peer.3001.c:0 "Demander au chapelain de m'aider à devenir [mpie_modeled_trait.GetName( ROOT.Char )|l] ([mpie_role_model_invest_chance|0]%)"
 mpie_role_model_success_tt:0 "Sur les traces d'un pair"
 mpie_role_model_failure_tt:0 "Toujours moi-même"
 mpie_role_model_failure_effect_tt:0 "Vous avez essayé de ressembler davantage [mpie_peer.Custom('FR_au_Char_U_Pi')][mpie_peer.GetShortUIName], mais cela ne vous convenait pas"
 mpie_role_model_adopted_effect_tt:0 "Vous avez adopté le [trait|El] [mpie_adopted_trait.GetName( mpie_actor )] au contact [mpie_peer.Custom('FR_du_Char_U_Pi')][mpie_peer.GetShortUIName]"
 mpie_role_model_rejected_tt:0 "Ce n'était pas pour moi"
 mpie_role_model_rejected_effect_tt:0 "Finalement, vous n'avez pas pu adopter le [trait|El] [mpie_adopted_trait.GetName( mpie_actor )]"

 # Alternative pastime (instead of the goal; small sure reward)
 mpie_peer_pastime.games:0 "Filer plutôt jouer avec les autres"
 mpie_peer_pastime.chapel:0 "S'éclipser plutôt à la chapelle"
 mpie_peer_pastime.quiet:0 "Chercher plutôt un coin tranquille"
 mpie_peer_pastime.showoff:0 "Se pavaner plutôt devant les autres"

 # Shared encounter tooltips
 mpie_peer_decline_tt:0 "Vous n'aurez pas d'autre occasion de poursuivre cet objectif durant cette [GetActivityType('activity_playdate').GetName]"
 mpie_peer_encounter_lost_tt:0 "L'occasion est passée"

 # Activity log
 mpie_peer_goal_missed_log_title:0 "Une occasion manquée"
 mpie_peer_goal_missed_log:0 "[CHARACTER.Custom('FR_le_Char_Pi')|U][CHARACTER.GetTitledFirstName] n'a jamais eu l'occasion de passer du temps avec [TARGET_CHARACTER.Custom('FR_le_Char_Pi')][TARGET_CHARACTER.GetTitledFirstName]"
 mpie_peer_goal_no_moment_log_title:0 "Pas un instant ensemble"
 mpie_peer_goal_no_moment_log:0 "[CHARACTER.Custom('FR_le_Char_Pi')|U][CHARACTER.GetTitledFirstName] n'a jamais trouvé le bon moment pour approcher [TARGET_CHARACTER.Custom('FR_le_Char_Pi')][TARGET_CHARACTER.GetTitledFirstName]"
 mpie_peer_befriend_failed_log_title:0 "L'amitié attendra"
 mpie_peer_befriend_failed_log:0 "[CHARACTER.Custom('FR_le_Char_Pi')|U][CHARACTER.GetTitledFirstName] a tenté de se lier d'amitié avec [TARGET_CHARACTER.Custom('FR_le_Char_Pi')][TARGET_CHARACTER.GetTitledFirstName], sans succès"
 mpie_peer_learned_log_title:0 "Une leçon retenue"
 mpie_peer_learned_log:0 "[CHARACTER.Custom('FR_le_Char_Pi')|U][CHARACTER.GetTitledFirstName] a appris une chose ou deux auprès [TARGET_CHARACTER.Custom('FR_du_Char_Pi')][TARGET_CHARACTER.GetTitledFirstName]"
 mpie_peer_learn_failed_log_title:0 "Une leçon perdue"
 mpie_peer_learn_failed_log:0 "[CHARACTER.Custom('FR_le_Char_Pi')|U][CHARACTER.GetTitledFirstName] a essayé d'apprendre auprès [TARGET_CHARACTER.Custom('FR_du_Char_Pi')][TARGET_CHARACTER.GetTitledFirstName], mais n'a pas réussi à suivre"
 mpie_peer_role_model_log_title:0 "Sur les traces d'un pair"
 mpie_peer_role_model_log:0 "[CHARACTER.Custom('FR_le_Char_Pi')|U][CHARACTER.GetTitledFirstName] a commencé à prendre exemple sur [TARGET_CHARACTER.Custom('FR_le_Char_Pi')][TARGET_CHARACTER.GetTitledFirstName]"
 mpie_peer_role_model_failed_log_title:0 "Toujours moi-même"
 mpie_peer_role_model_failed_log:0 "[CHARACTER.Custom('FR_le_Char_Pi')|U][CHARACTER.GetTitledFirstName] a essayé de ressembler davantage [TARGET_CHARACTER.Custom('FR_au_Char_Pi')][TARGET_CHARACTER.GetTitledFirstName], mais cela ne lui convenait pas"

 # Relationship reason
 mpie_friend_meet_peers_reason:0 "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUIName|U] et [TARGET_CHARACTER.Custom('FR_le_Char_U_Pi')][TARGET_CHARACTER.GetShortUIName] [Select_CString(Or(CHARACTER.IsLocalPlayer, TARGET_CHARACTER.IsLocalPlayer), 'êtes', 'sont')] [Select_CString(And(CHARACTER.IsFemale, TARGET_CHARACTER.IsFemale), 'devenues amies', 'devenus amis')] lors d'une [GetActivityType('activity_playdate').GetNameNoTooltip]."

 # Court children host Meet Peers (mpie_court_triggers.txt, events/activities/mpie_court_meet_peers_events.txt)
 mpie_court.0001.t:0 "Une requête à la cour"
 mpie_court.0001.desc:0 "Depuis ce matin, [mpie_court_child.GetFirstName] me suit partout dans la grande salle. Enfin, [mpie_court_child.GetSheHe] tire sur ma manche.\n\n« S'il vous plaît, puis-je organiser une [GetActivityType('activity_playdate').GetName] ? Je veux inviter les autres enfants, de tout le pays et même d'au-delà ! »\n\nUne [GetActivityType('activity_playdate').GetNameNoTooltip] à ma cour coûterait environ [mpie_court_meet_peers_cost|0][gold_i]."
 mpie_court.0001.a:0 "Bien sûr, [Select_CString(mpie_court_child.IsFemale,'ma petite','mon petit')]. Je m'en occupe !"
 mpie_court.0001.b:0 "Pas cette année, [mpie_court_child.GetFirstName]."
 mpie_court_meet_peers_accept_tt:0 "La fenêtre de planification de la [GetActivityType('activity_playdate').GetName] s'ouvre avec [mpie_court_child.GetFirstName] comme Jeune hôte. Vous pouvez aussi la planifier plus tard, au cours de l'année à venir : un rappel en haut de l'écran vous y mènera"
 mpie_court_meet_peers_declined_tt:0 "[mpie_court_child.GetFirstName] ne redemandera pas avant un an"
 mpie_court_meet_peers_started_title:0 "[mpie_court_child.GetFirstName] organise une [GetActivityType('activity_playdate').GetNameNoTooltip]"
 mpie_court_meet_peers_started_desc:0 "[mpie_court_child.GetFirstName] a pris le relais en tant qu'hôte de la [GetActivityType('activity_playdate').GetName] que vous aviez planifiée"

 # End report for a player ruler (mpie_court.0100)
 mpie_court.0100.t:0 "La [GetActivityType('activity_playdate').GetNameNoTooltip] de [mpie_report_host.GetFirstName]"
 mpie_court.0100.desc_guests_none:0 "La [GetActivityType('activity_playdate').GetName] que j'ai organisée pour [mpie_report_host.GetFirstName] est terminée, mais aucun autre enfant n'est venu."
 mpie_court.0100.desc_guests_one:0 "La [GetActivityType('activity_playdate').GetName] que j'ai organisée pour [mpie_report_host.GetFirstName] est terminée. Un seul autre enfant est venu."
 mpie_court.0100.desc_guests_many:0 "La [GetActivityType('activity_playdate').GetName] que j'ai organisée pour [mpie_report_host.GetFirstName] est terminée. [mpie_report_guests|0] autres enfants sont venus."
 mpie_court.0100.desc_family_sibling_and_more:0 "Parmi eux se trouvaient [mpie_report_sibling.GetFirstName] et encore [mpie_report_family_others|0] de la famille."
 mpie_court.0100.desc_family_sibling:0 "[mpie_report_sibling.GetFirstName] était du nombre."
 mpie_court.0100.desc_family_relative_and_more:0 "Parmi eux se trouvaient [mpie_report_relative.GetFirstName] et encore [mpie_report_family_others|0] de la famille."
 mpie_court.0100.desc_family_relative:0 "[mpie_report_relative.GetFirstName], un membre de la famille, était du nombre."
